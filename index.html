urnal de Physique.", "aporte": "Propuso que volúmenes iguales de gases a igual presión y temperatura contienen el mismo número de moléculas. El número de Avogadro es fundamental en química.", "foto": "amedeo-avogadro"}, {"n": 123, "nombre": "Marie-Sophie Germain", "wiki": "Sophie Germain", "vida": "1776 - 1831", "area": "Matemáticas y física", "obra": "Escribió «Recherches sur la théorie des surfaces élastiques» (1821), memoria premiada por la Academia de Ciencias de París sobre la vibración de placas.", "aporte": "Logró avances en el último teorema de Fermat con los hoy llamados primos de Sophie Germain y fundó la teoría de la elasticidad, pese a que se le negó la educación formal.", "foto": "sophie-germain"}, {"n": 124, "nombre": "Johann Carl Friedrich Gauss", "wiki": "Carl Friedrich Gauss", "vida": "1777 - 1855", "area": "Matemáticas, física y astronomía", "obra": "Escribió «Disquisitiones arithmeticae» (1801), obra fundadora de la teoría de números moderna, y «Theoria motus corporum coelestium» (1809), sobre órbitas.", "aporte": "Llamado príncipe de las matemáticas, demostró el teorema fundamental del álgebra, creó el método de mínimos cuadrados y la distribución normal. Aportó al magnetismo y la geodesia.", "foto": "carl-friedrich-gauss"}, {"n": 125, "nombre": "Hans Christian Ørsted", "wiki": "Hans Christian Ørsted", "vida": "1777 - 1851", "area": "Física y química", "obra": "Publicó en 1820 el breve artículo en latín «Experimenta circa effectum conflictus electrici in acum magneticam», con su descubrimiento.", "aporte": "Descubrió que una corriente eléctrica desvía una brújula, primera prueba de la relación entre electricidad y magnetismo. Aisló el aluminio por primera vez en 1825.", "foto": "hans-christian-orsted"}, {"n": 126, "nombre": "Humphry Davy", "wiki": "Humphry Davy", "vida": "1778 - 1829", "area": "Química", "obra": "Publicó «Elementos de filosofía química» (1812) y artículos sobre electroquímica. Dirigió la Royal Institution, donde formó a Michael Faraday.", "aporte": "Aisló por electrólisis el sodio, el potasio, el calcio y otros elementos. Inventó la lámpara de seguridad para mineros, que salvó miles de vidas en las minas de carbón.", "foto": "humphry-davy"}, {"n": 127, "nombre": "Jöns Jacob Berzelius", "wiki": "Jöns Jacob Berzelius", "vida": "1779 - 1848", "area": "Química", "obra": "Escribió «Tratado de química» (1808-1818), manual de referencia en Europa, y tablas de pesos atómicos de unos dos mil compuestos.", "aporte": "Introdujo los símbolos químicos actuales (H, O, Fe) y los términos isómero, catálisis y proteína. Descubrió el selenio, el silicio, el cerio y el torio.", "foto": "jons-jacob-berzelius"}, {"n": 128, "nombre": "Augustin-Jean Fresnel", "wiki": "Augustin-Jean Fresnel", "vida": "1788 - 1827", "area": "Física (óptica)", "obra": "Presentó en 1818 su «Memoria sobre la difracción de la luz», premiada por la Academia de Ciencias de París, y trabajos sobre polarización.", "aporte": "Consolidó la teoría ondulatoria de la luz con matemáticas rigurosas. Inventó la lente que lleva su nombre, usada en faros, que permitió ver su luz a grandes distancias.", "foto": "augustin-jean-fresnel"}, {"n": 129, "nombre": "Georg Simon Ohm", "wiki": "Georg Simon Ohm", "vida": "1789 - 1854", "area": "Física", "obra": "Escribió «Die galvanische Kette, mathematisch bearbeitet» (1827), donde expone matemáticamente el funcionamiento de los circuitos eléctricos, a partir de experimentos con alambres de distinto largo y grosor.", "aporte": "Formuló la ley de Ohm: la corriente es proporcional al voltaje e inversamente proporcional a la resistencia. Es la ley básica de la electrónica; la unidad de resistencia lleva su nombre.", "foto": "georg-simon-ohm"}, {"n": 130, "nombre": "Augustin-Louis Cauchy", "wiki": "Augustin-Louis Cauchy", "vida": "1789 - 1857", "area": "Matemáticas", "obra": "Escribió «Cours d'analyse» (1821) para la Escuela Politécnica y publicó cerca de ochocientos artículos sobre análisis, álgebra y mecánica.", "aporte": "Dio rigor al cálculo con definiciones precisas de límite, continuidad y convergencia. Fundó el análisis complejo y la teoría de la elasticidad.", "foto": "augustin-louis-cauchy"}, {"n": 131, "nombre": "Michael Faraday", "wiki": "Michael Faraday", "vida": "1791 - 1867", "area": "Física y química", "obra": "Publicó «Investigaciones experimentales en electricidad» (1839-1855), tres volúmenes con sus experimentos, y «La historia química de una vela».", "aporte": "Descubrió la inducción electromagnética, base de generadores y transformadores, y las leyes de la electrólisis. Introdujo el concepto de campo. Construyó el primer motor eléctrico.", "foto": "michael-faraday"}, {"n": 132, "nombre": "Charles Babbage", "wiki": "Charles Babbage", "vida": "1791 - 1871", "area": "Matemáticas e ingeniería computacional", "obra": "Diseñó la máquina diferencial y la máquina analítica, y escribió «Sobre la economía de las máquinas y las manufacturas» (1832).", "aporte": "Concibió la máquina analítica, primer diseño de una computadora programable de uso general, con memoria, unidad de cálculo y tarjetas perforadas. Es el padre de la computación.", "foto": "charles-babbage"}, {"n": 133, "nombre": "Nikolái Ivánovich Lobachevski", "wiki": "Nikolái Lobachevski", "vida": "1792 - 1856", "area": "Matemáticas", "obra": "Publicó «Sobre los principios de la geometría» (1829) y «Pangeometría» (1855), donde desarrolla una geometría sin el postulado de las paralelas de Euclides.", "aporte": "Creó la geometría hiperbólica, primera geometría no euclidiana publicada. Demostró que pueden existir geometrías coherentes distintas a la de Euclides, base de la relatividad.", "foto": "nikolai-lobachevski"}, {"n": 134, "nombre": "Nicolas Léonard Sadi Carnot", "wiki": "Sadi Carnot", "vida": "1796 - 1832", "area": "Física (termodinámica)", "obra": "Escribió «Reflexiones sobre la potencia motriz del fuego» (1824), único libro que publicó, donde analiza el rendimiento de las máquinas de vapor.", "aporte": "Fundó la termodinámica. Demostró que el rendimiento máximo de una máquina térmica depende solo de las temperaturas del foco caliente y el frío (ciclo de Carnot).", "foto": "sadi-carnot"}, {"n": 135, "nombre": "Charles Lyell", "wiki": "Charles Lyell", "vida": "1797 - 1875", "area": "Geología", "obra": "Escribió «Principios de geología» (1830-1833), tres volúmenes que difunden el uniformismo con abundantes ejemplos de campo. Darwin lo llevó en el Beagle.", "aporte": "Convenció a la comunidad científica de la enorme antigüedad de la Tierra y de que la geología se explica por procesos lentos y graduales. Influyó decisivamente en Darwin.", "foto": "charles-lyell"}, {"n": 136, "nombre": "Mary Anning", "wiki": "Mary Anning", "vida": "1799 - 1847", "area": "Paleontología", "obra": "No publicó libros; sus hallazgos en los acantilados de Lyme Regis fueron descritos por otros. Encontró el primer esqueleto completo de ictiosaurio y de plesiosaurio.", "aporte": "Sus descubrimientos de reptiles marinos del Jurásico demostraron la extinción y transformaron la idea de la historia de la vida. Hoy es reconocida como pionera de la paleontología.", "foto": "mary-anning"}, {"n": 137, "nombre": "Friedrich Wöhler", "wiki": "Friedrich Wöhler", "vida": "1800 - 1882", "area": "Química", "obra": "Publicó en 1828 «Sobre la formación artificial de la urea» en los Annalen der Physik und Chemie. Escribió manuales de química usados en toda Europa.", "aporte": "Sintetizó urea a partir de sustancias inorgánicas, refutando que los compuestos orgánicos requieren una fuerza vital. Fundó la química orgánica moderna y aisló el aluminio y el berilio.", "foto": "friedrich-wohler"}, {"n": 138, "nombre": "Niels Henrik Abel", "wiki": "Niels Henrik Abel", "vida": "1802 - 1829", "area": "Matemáticas", "obra": "Publicó en 1824 la «Memoria sobre ecuaciones algebraicas» y trabajos sobre funciones elípticas en el Journal de Crelle, en una vida de solo veintiséis años.", "aporte": "Demostró que no existe fórmula general con radicales para resolver ecuaciones de quinto grado. Los grupos abelianos y el premio Abel, equivalente al Nobel de matemáticas, llevan su nombre.", "foto": "niels-henrik-abel"}, {"n": 139, "nombre": "Justus von Liebig", "wiki": "Justus von Liebig", "vida": "1803 - 1873", "area": "Química", "obra": "Escribió «La química orgánica aplicada a la agricultura y la fisiología» (1840). Fundó en Giessen el primer laboratorio moderno de enseñanza química.", "aporte": "Demostró que las plantas necesitan nitrógeno, fósforo y potasio, lo que dio origen a los fertilizantes. Es el padre de la química agrícola y de la enseñanza en laboratorio.", "foto": "justus-von-liebig"}, {"n": 140, "nombre": "Charles Robert Darwin", "wiki": "Charles Darwin", "vida": "1809 - 1882", "area": "Biología y naturalismo", "obra": "Escribió «El origen de las especies» (1859), donde expone la evolución por selección natural, y «El origen del hombre» (1871). Viajó cinco años en el Beagle, también por Perú.", "aporte": "Explicó la diversidad de la vida mediante la evolución por selección natural: los individuos mejor adaptados sobreviven y transmiten sus rasgos. Es el fundamento de toda la biología.", "foto": "charles-darwin"}, {"n": 141, "nombre": "Évariste Galois", "wiki": "Évariste Galois", "vida": "1811 - 1832", "area": "Matemáticas", "obra": "Sus memorias, escritas antes de morir en un duelo a los veinte años, fueron publicadas por Liouville en 1846. Incluyen la carta a Auguste Chevalier escrita la noche anterior.", "aporte": "Creó la teoría de grupos y la teoría de Galois, que explica cuándo una ecuación se resuelve por radicales. Sus ideas son base del álgebra moderna y la criptografía.", "foto": "evariste-galois"}, {"n": 142, "nombre": "Augusta Ada King, condesa de Lovelace (Ada Lovelace)", "wiki": "Ada Lovelace", "vida": "1815 - 1852", "area": "Matemáticas y computación", "obra": "Tradujo en 1843 un artículo de Menabrea sobre la máquina analítica de Babbage y añadió notas extensas, entre ellas la célebre nota G con un algoritmo.", "aporte": "Escribió el primer algoritmo destinado a una máquina, para calcular números de Bernoulli, y es considerada la primera programadora. Intuyó que las computadoras podrían manipular símbolos y música.", "foto": "ada-lovelace"}, {"n": 143, "nombre": "George Boole", "wiki": "George Boole", "vida": "1815 - 1864", "area": "Matemáticas y lógica", "obra": "Escribió «El análisis matemático de la lógica» (1847) y «Una investigación de las leyes del pensamiento» (1854), donde traduce el razonamiento lógico a ecuaciones algebraicas.", "aporte": "Creó el álgebra de Boole, que expresa la lógica con operaciones de verdadero y falso. Es la base de los circuitos digitales y de toda la informática.", "foto": "george-boole"}, {"n": 144, "nombre": "James Prescott Joule", "wiki": "James Prescott Joule", "vida": "1818 - 1889", "area": "Física", "obra": "Publicó «Sobre el equivalente mecánico del calor» (1850) en las Philosophical Transactions, con su experimento de las paletas que agitan agua.", "aporte": "Demostró que el calor es una forma de energía y midió su equivalente mecánico, clave para la ley de conservación de la energía. La unidad de energía, el julio, lleva su nombre.", "foto": "james-prescott-joule"}, {"n": 145, "nombre": "Ignác Fülöp Semmelweis", "wiki": "Ignaz Semmelweis", "vida": "1818 - 1865", "area": "Medicina (obstetricia)", "obra": "Escribió «Etiología, concepto y profilaxis de la fiebre puerperal» (1861), donde presenta los datos de mortalidad del hospital general de Viena.", "aporte": "Demostró que lavarse las manos con cloro reducía drásticamente la muerte de madres por fiebre puerperal. Fue rechazado en su época y hoy es pionero de la antisepsia.", "foto": "ignaz-semmelweis"}, {"n": 146, "nombre": "Jean Bernard Léon Foucault", "wiki": "Léon Foucault", "vida": "1819 - 1868", "area": "Física", "obra": "Presentó en 1851 su péndulo en el Panteón de París y publicó trabajos sobre la velocidad de la luz y el giroscopio en las Comptes rendus de la Academia.", "aporte": "Demostró de forma visible la rotación de la Tierra con su péndulo. Midió la velocidad de la luz con precisión y probó que es menor en el agua que en el aire.", "foto": "leon-foucault"}, {"n": 147, "nombre": "Hermann Ludwig Ferdinand von Helmholtz", "wiki": "Hermann von Helmholtz", "vida": "1821 - 1894", "area": "Física y fisiología", "obra": "Escribió «Sobre la conservación de la fuerza» (1847), «Manual de óptica fisiológica» (1856-1867) y «Sobre las sensaciones del tono» (1863).", "aporte": "Formuló con rigor el principio de conservación de la energía. Inventó el oftalmoscopio, midió la velocidad del impulso nervioso y explicó la percepción del sonido y el color.", "foto": "hermann-von-helmholtz"}, {"n": 148, "nombre": "Rudolf Ludwig Karl Virchow", "wiki": "Rudolf Virchow", "vida": "1821 - 1902", "area": "Medicina y patología", "obra": "Escribió «La patología celular» (1858), donde explica las enfermedades como alteraciones de las células. Fundó la revista Archiv für pathologische Anatomie.", "aporte": "Fundó la patología celular con el principio de que toda célula procede de otra célula. Describió la leucemia y la embolia, e impulsó la salud pública y la medicina social.", "foto": "rudolf-virchow"}, {"n": 149, "nombre": "Gregor Johann Mendel", "wiki": "Gregor Mendel", "vida": "1822 - 1884", "area": "Genética y botánica", "obra": "Publicó «Experimentos sobre hibridación de plantas» (1866), basado en ocho años de cruces de unas veintiocho mil plantas de guisante en el huerto de su monasterio.", "aporte": "Descubrió las leyes de la herencia: los rasgos se transmiten mediante factores (hoy genes) en proporciones predecibles. Su trabajo fue ignorado hasta 1900 y fundó la genética.", "foto": "gregor-mendel"}, {"n": 150, "nombre": "Louis Pasteur", "wiki": "Louis Pasteur", "vida": "1822 - 1895", "area": "Microbiología y química", "obra": "Publicó «Estudios sobre la cerveza» (1876), «Estudios sobre el vino» y trabajos sobre la fermentación y la generación espontánea. Fundó el Instituto Pasteur en 1887.", "aporte": "Demostró que los microorganismos causan fermentación y enfermedades, refutó la generación espontánea, creó la pasteurización y las vacunas contra la rabia y el carbunco.", "foto": "louis-pasteur"}, {"n": 151, "nombre": "Rudolf Julius Emanuel Clausius", "wiki": "Rudolf Clausius", "vida": "1822 - 1888", "area": "Física (termodinámica)", "obra": "Publicó «Sobre la fuerza motriz del calor» (1850) y «La teoría mecánica del calor» (1865), donde introduce y nombra la entropía.", "aporte": "Formuló la segunda ley de la termodinámica: el calor no pasa espontáneamente de un cuerpo frío a uno caliente. Introdujo el concepto de entropía, clave en física y química.", "foto": "rudolf-clausius"}, {"n": 152, "nombre": "Alfred Russel Wallace", "wiki": "Alfred Russel Wallace", "vida": "1823 - 1913", "area": "Biología y biogeografía", "obra": "Escribió «El archipiélago malayo» (1869) y «La distribución geográfica de los animales» (1876). Envió a Darwin en 1858 un ensayo sobre la selección natural.", "aporte": "Formuló la teoría de la selección natural de forma independiente a Darwin, con quien la presentó en 1858. Fundó la biogeografía; la línea de Wallace separa la fauna asiática de la australiana.", "foto": "alfred-russel-wallace"}, {"n": 153, "nombre": "Antonio Raimondi Dell'Acqua", "wiki": "Antonio Raimondi", "vida": "1824 - 1890", "area": "Naturalismo, geografía y geología", "obra": "Escribió «El Perú» (1874-1913), obra en seis tomos sobre geografía, historia natural y minerales del país, fruto de diecinueve años de viajes por todas sus regiones.", "aporte": "Fue el gran explorador científico del Perú: describió miles de plantas, animales y minerales. La Puya raimondii lleva su nombre y su mapa del Perú fue referencia durante décadas.", "foto": "antonio-raimondi"}, {"n": 154, "nombre": "William Thomson, lord Kelvin", "wiki": "William Thomson", "vida": "1824 - 1907", "area": "Física e ingeniería", "obra": "Publicó cientos de artículos y, con Peter Tait, el «Tratado de filosofía natural» (1867). Dirigió la tecnología del primer cable telegráfico transatlántico.", "aporte": "Propuso la escala absoluta de temperatura y el cero absoluto; la unidad kelvin lleva su nombre. Formuló la segunda ley de la termodinámica y aportó al electromagnetismo.", "foto": "william-thomson"}, {"n": 155, "nombre": "Georg Friedrich Bernhard Riemann", "wiki": "Bernhard Riemann", "vida": "1826 - 1866", "area": "Matemáticas", "obra": "Escribió «Sobre las hipótesis en que se funda la geometría» (1854) y «Sobre el número de primos menores que una cantidad dada» (1859), apenas ocho páginas.", "aporte": "Creó la geometría de espacios curvos, que Einstein usó en la relatividad general, y la integral de Riemann. Su hipótesis sobre los números primos sigue sin demostrarse.", "foto": "bernhard-riemann"}, {"n": 156, "nombre": "Joseph Lister", "wiki": "Joseph Lister", "vida": "1827 - 1912", "area": "Medicina y cirugía", "obra": "Publicó en 1867 en The Lancet «Sobre el principio antiséptico en la práctica de la cirugía», basado en sus resultados en Glasgow.", "aporte": "Introdujo la cirugía antiséptica con ácido fénico para limpiar heridas e instrumentos, siguiendo a Pasteur. Redujo drásticamente las muertes por infección tras las operaciones.", "foto": "joseph-lister"}, {"n": 157, "nombre": "Friedrich August Kekulé von Stradonitz", "wiki": "Friedrich August Kekulé", "vida": "1829 - 1896", "area": "Química orgánica", "obra": "Escribió «Manual de química orgánica» (1859-1887) y publicó en 1865 su teoría sobre la constitución de las sustancias aromáticas.", "aporte": "Propuso que el carbono forma cuatro enlaces y puede unirse en cadenas, y describió la estructura en anillo del benceno. Fundó la química estructural orgánica.", "foto": "friedrich-august-kekule"}, {"n": 158, "nombre": "James Clerk Maxwell", "wiki": "James Clerk Maxwell", "vida": "1831 - 1879", "area": "Física", "obra": "Escribió «Una teoría dinámica del campo electromagnético» (1865) y «Tratado sobre electricidad y magnetismo» (1873), con sus célebres ecuaciones.", "aporte": "Unificó electricidad, magnetismo y luz en cuatro ecuaciones y predijo las ondas electromagnéticas. Contribuyó a la teoría cinética de los gases y obtuvo la primera fotografía en color.", "foto": "james-clerk-maxwell"}, {"n": 159, "nombre": "Alfred Bernhard Nobel", "wiki": "Alfred Nobel", "vida": "1833 - 1896", "area": "Química e ingeniería", "obra": "Patentó la dinamita en 1867 y registró más de trescientas cincuenta patentes. En su testamento de 1895 creó los premios que llevan su nombre.", "aporte": "Inventó la dinamita, que hizo más segura la nitroglicerina y transformó la minería y la construcción. Sus premios son el máximo reconocimiento científico mundial.", "foto": "alfred-nobel"}, {"n": 160, "nombre": "Carlos Juan Finlay Barrés", "wiki": "Carlos Finlay", "vida": "1833 - 1915", "area": "Medicina y epidemiología", "obra": "Presentó en 1881 en la Academia de Ciencias de La Habana «El mosquito hipotéticamente considerado como agente de transmisión de la fiebre amarilla».", "aporte": "Descubrió que el mosquito Aedes aegypti transmite la fiebre amarilla, lo que permitió controlar la enfermedad y construir el canal de Panamá. Fue nominado varias veces al Nobel.", "foto": "carlos-finlay"}, {"n": 161, "nombre": "Dmitri Ivánovich Mendeléyev", "wiki": "Dmitri Mendeléyev", "vida": "1834 - 1907", "area": "Química", "obra": "Escribió «Principios de química» (1868-1870), donde presentó en 1869 su tabla periódica de los elementos ordenados por peso atómico y propiedades.", "aporte": "Creó la tabla periódica y predijo propiedades de elementos aún no descubiertos, como el galio y el germanio. Su tabla es la herramienta central de la química.", "foto": "dmitri-mendeleyev"}, {"n": 162, "nombre": "Ernst Heinrich Philipp August Haeckel", "wiki": "Ernst Haeckel", "vida": "1834 - 1919", "area": "Biología y zoología", "obra": "Escribió «Morfología general de los organismos» (1866) y «Formas artísticas de la naturaleza» (1904), con cien láminas de organismos marinos.", "aporte": "Acuñó el término ecología y elaboró los primeros árboles filogenéticos. Describió miles de especies marinas y difundió la teoría de Darwin en Alemania.", "foto": "ernst-haeckel"}, {"n": 163, "nombre": "Robert Heinrich Hermann Koch", "wiki": "Robert Koch", "vida": "1843 - 1910", "area": "Microbiología y medicina", "obra": "Publicó «La etiología de la tuberculosis» (1882) y trabajos sobre el carbunco y el cólera. Dirigió el Instituto de Enfermedades Infecciosas de Berlín.", "aporte": "Descubrió las bacterias causantes de la tuberculosis y el cólera y formuló los postulados de Koch para identificar agentes de enfermedad. Recibió el Nobel de Medicina en 1905.", "foto": "robert-koch"}, {"n": 164, "nombre": "Ludwig Eduard Boltzmann", "wiki": "Ludwig Boltzmann", "vida": "1844 - 1906", "area": "Física", "obra": "Escribió «Lecciones sobre la teoría de los gases» (1896-1898) y numerosos artículos sobre mecánica estadística en la Academia de Ciencias de Viena.", "aporte": "Fundó la mecánica estadística al explicar la entropía como medida del número de estados microscópicos posibles. Su ecuación está grabada en su tumba en Viena.", "foto": "ludwig-boltzmann"}, {"n": 165, "nombre": "Georg Ferdinand Ludwig Philipp Cantor", "wiki": "Georg Cantor", "vida": "1845 - 1918", "area": "Matemáticas", "obra": "Publicó entre 1874 y 1897 una serie de artículos sobre conjuntos, entre ellos «Contribuciones a la fundamentación de la teoría de conjuntos transfinitos».", "aporte": "Creó la teoría de conjuntos y demostró que hay infinitos de distintos tamaños, como el de los números naturales y el de los reales. Su teoría es la base de las matemáticas modernas.", "foto": "georg-cantor"}, {"n": 166, "nombre": "Wilhelm Conrad Röntgen", "wiki": "Wilhelm Röntgen", "vida": "1845 - 1923", "area": "Física", "obra": "Publicó en 1895 «Sobre una nueva clase de rayos», donde describe la radiación invisible que atravesaba objetos y velaba placas fotográficas.", "aporte": "Descubrió los rayos X y tomó la primera radiografía, la mano de su esposa. Recibió el primer Nobel de Física en 1901 y revolucionó el diagnóstico médico.", "foto": "wilhelm-rontgen"}, {"n": 167, "nombre": "Thomas Alva Edison", "wiki": "Thomas Edison", "vida": "1847 - 1931", "area": "Ingeniería e invención", "obra": "Registró más de mil patentes en Estados Unidos y fundó en Menlo Park el primer laboratorio industrial de investigación. Publicó sus resultados en revistas técnicas.", "aporte": "Desarrolló la bombilla incandescente práctica, el fonógrafo y el primer sistema de distribución eléctrica. Convirtió la invención en un trabajo de equipo organizado.", "foto": "thomas-edison"}, {"n": 168, "nombre": "Alexander Graham Bell", "wiki": "Alexander Graham Bell", "vida": "1847 - 1922", "area": "Ingeniería y acústica", "obra": "Patentó el teléfono en 1876. Trabajó en la enseñanza de personas sordas y cofundó la National Geographic Society y la revista Science.", "aporte": "Desarrolló el primer teléfono práctico, que transformó las comunicaciones mundiales. Investigó la transmisión de sonido por luz (fotófono) y la aeronáutica.", "foto": "alexander-graham-bell"}, {"n": 169, "nombre": "Iván Petróvich Pávlov", "wiki": "Iván Pávlov", "vida": "1849 - 1936", "area": "Fisiología y psicología", "obra": "Escribió «Lecciones sobre el trabajo de las principales glándulas digestivas» (1897) y «Reflejos condicionados» (1927), basados en décadas de experimentos con perros en su laboratorio de San Petersburgo.", "aporte": "Descubrió el reflejo condicionado al asociar un estímulo neutro con la comida en perros. Ganó el Nobel en 1904 por sus estudios de la digestión y fundó la psicología del aprendizaje.", "foto": "ivan-pavlov"}, {"n": 170, "nombre": "Federico Villarreal Villarreal", "wiki": "Federico Villarreal", "vida": "1850 - 1923", "area": "Matemáticas, física e ingeniería", "obra": "Publicó en 1873 su método para elevar un polinomio a cualquier potencia y escribió numerosas obras de matemáticas, física, astronomía e ingeniería. Fue rector de San Marcos.", "aporte": "Es el mayor matemático peruano del siglo XIX y primer doctor en matemáticas del país. Impulsó la enseñanza científica en el Perú; una universidad de Lima lleva su nombre.", "foto": "federico-villarreal"}, {"n": 171, "nombre": "Antoine Henri Becquerel", "wiki": "Henri Becquerel", "vida": "1852 - 1908", "area": "Física", "obra": "Publicó en 1896 en las Comptes rendus de la Academia de Ciencias de París varias notas sobre las radiaciones emitidas por las sales de uranio.", "aporte": "Descubrió la radiactividad al notar que el uranio velaba placas fotográficas sin necesidad de luz. Compartió el Nobel de Física de 1903 con Pierre y Marie Curie.", "foto": "henri-becquerel"}, {"n": 172, "nombre": "Santiago Ramón y Cajal", "wiki": "Santiago Ramón y Cajal", "vida": "1852 - 1934", "area": "Neurociencia e histología", "obra": "Escribió «Textura del sistema nervioso del hombre y de los vertebrados» (1899-1904) y dejó miles de dibujos de neuronas hechos al microscopio.", "aporte": "Demostró que el sistema nervioso está formado por células independientes, las neuronas, que se comunican por contacto. Es el padre de la neurociencia; Nobel de Medicina en 1906.", "foto": "santiago-ramon-y-cajal"}, {"n": 173, "nombre": "Hendrik Antoon Lorentz", "wiki": "Hendrik Lorentz", "vida": "1853 - 1928", "area": "Física", "obra": "Escribió «La teoría de los electrones» (1909) y artículos sobre la electrodinámica de cuerpos en movimiento, donde aparecen sus transformaciones.", "aporte": "Desarrolló la teoría del electrón y las transformaciones de Lorentz, base matemática de la relatividad especial. Compartió el Nobel de Física de 1902 con Pieter Zeeman.", "foto": "hendrik-lorentz"}, {"n": 174, "nombre": "Jules Henri Poincaré", "wiki": "Henri Poincaré", "vida": "1854 - 1912", "area": "Matemáticas y física", "obra": "Escribió «Los nuevos métodos de la mecánica celeste» (1892-1899), «La ciencia y la hipótesis» (1902) y trabajos de topología como «Analysis situs».", "aporte": "Fundó la topología algebraica y la teoría del caos al estudiar el problema de los tres cuerpos. Anticipó ideas de la relatividad. Su conjetura se resolvió en 2003.", "foto": "henri-poincare"}, {"n": 175, "nombre": "Paul Ehrlich", "wiki": "Paul Ehrlich", "vida": "1854 - 1915", "area": "Medicina e inmunología", "obra": "Publicó trabajos sobre la tinción de tejidos, la teoría de las cadenas laterales de la inmunidad y la quimioterapia. Dirigió el Instituto de Terapia Experimental de Fráncfort.", "aporte": "Creó el Salvarsán, primer fármaco eficaz contra la sífilis y fundó la quimioterapia con la idea de la bala mágica. Nobel de Medicina en 1908 por sus trabajos de inmunología.", "foto": "paul-ehrlich"}]}, {"titulo": "Del siglo XIX al XX", "sub": "Nacidos entre 1856 y 1899", "items": [{"n": 176, "nombre": "Nikola Tesla", "wiki": "Nikola Tesla", "vida": "1856 - 1943", "area": "Ingeniería eléctrica y física", "obra": "Registró unas trescientas patentes y publicó «Mis inventos» (1919). Presentó en 1888 «Un nuevo sistema de motores y transformadores de corriente alterna».", "aporte": "Desarrolló el motor de inducción y el sistema de corriente alterna que hoy distribuye electricidad en todo el mundo. Investigó la transmisión inalámbrica de energía y la radio.", "foto": "nikola-tesla"}, {"n": 177, "nombre": "Joseph John Thomson", "wiki": "J. J. Thomson", "vida": "1856 - 1940", "area": "Física", "obra": "Publicó en 1897 «Rayos catódicos» en Philosophical Magazine, donde demuestra que están formados por partículas, y «Conducción de la electricidad a través de gases» (1903).", "aporte": "Descubrió el electrón, primera partícula subatómica, y propuso el modelo atómico del budín de pasas. Recibió el Nobel de Física en 1906; siete de sus alumnos también lo ganaron.", "foto": "j-j-thomson"}, {"n": 178, "nombre": "Sigismund Schlomo Freud", "wiki": "Sigmund Freud", "vida": "1856 - 1939", "area": "Neurología y psicología", "obra": "Escribió «La interpretación de los sueños» (1899), «Tres ensayos sobre teoría sexual» (1905) y «El yo y el ello» (1923).", "aporte": "Fundó el psicoanálisis, que estudia los procesos inconscientes de la mente y su efecto en la conducta. Aunque discutido como ciencia, transformó la psicología y la cultura del siglo XX.", "foto": "sigmund-freud"}, {"n": 179, "nombre": "Heinrich Rudolf Hertz", "wiki": "Heinrich Hertz", "vida": "1857 - 1894", "area": "Física", "obra": "Publicó entre 1887 y 1890 sus experimentos sobre ondas eléctricas, reunidos en «Investigaciones sobre la propagación de la fuerza eléctrica» (1892).", "aporte": "Demostró experimentalmente la existencia de las ondas electromagnéticas predichas por Maxwell, base de la radio y la televisión. La unidad de frecuencia, el hercio, lleva su nombre.", "foto": "heinrich-hertz"}, {"n": 180, "nombre": "Daniel Alcides Carrión García", "wiki": "Daniel Alcides Carrión", "vida": "1857 - 1885", "area": "Medicina", "obra": "Dejó un diario clínico de su propia enfermedad, escrito tras inocularse en 1885 la sangre de un paciente con verruga peruana, completado por sus compañeros.", "aporte": "Demostró con su propia vida que la verruga peruana y la fiebre de La Oroya son la misma enfermedad, hoy llamada enfermedad de Carrión. Es el héroe de la medicina peruana.", "foto": "daniel-alcides-carrion"}, {"n": 181, "nombre": "Max Karl Ernst Ludwig Planck", "wiki": "Max Planck", "vida": "1858 - 1947", "area": "Física", "obra": "Presentó en 1900 «Sobre la ley de distribución de energía en el espectro normal», donde introduce la constante h. Escribió «Tratado de termodinámica» (1897).", "aporte": "Propuso que la energía se emite en paquetes discretos llamados cuantos, lo que dio nacimiento a la física cuántica. Recibió el Nobel de Física en 1918.", "foto": "max-planck"}, {"n": 182, "nombre": "Pierre Curie", "wiki": "Pierre Curie", "vida": "1859 - 1906", "area": "Física", "obra": "Publicó con su hermano Jacques el descubrimiento de la piezoelectricidad (1880) y, con Marie Curie, los trabajos sobre el polonio y el radio (1898).", "aporte": "Descubrió la piezoelectricidad y la ley de Curie sobre el magnetismo y la temperatura. Con Marie Curie descubrió el polonio y el radio; Nobel de Física en 1903.", "foto": "pierre-curie"}, {"n": 183, "nombre": "Svante August Arrhenius", "wiki": "Svante Arrhenius", "vida": "1859 - 1927", "area": "Química y física", "obra": "Escribió su tesis sobre la conductividad de los electrolitos (1884) y «Sobre la influencia del ácido carbónico del aire en la temperatura de la superficie» (1896).", "aporte": "Explicó la disociación iónica de las sustancias en agua (Nobel de Química en 1903). Fue el primero en calcular que el CO2 producido por los humanos calentaría el planeta.", "foto": "svante-arrhenius"}, {"n": 184, "nombre": "David Hilbert", "wiki": "David Hilbert", "vida": "1862 - 1943", "area": "Matemáticas", "obra": "Escribió «Fundamentos de la geometría» (1899) y presentó en 1900, en el Congreso Internacional de Matemáticos de París, una lista de veintitrés problemas abiertos.", "aporte": "Sus veintitrés problemas orientaron la investigación matemática del siglo XX. Creó los espacios de Hilbert, base de la mecánica cuántica, y axiomatizó la geometría.", "foto": "david-hilbert"}, {"n": 185, "nombre": "Thomas Hunt Morgan", "wiki": "Thomas Hunt Morgan", "vida": "1866 - 1945", "area": "Genética", "obra": "Escribió «El mecanismo de la herencia mendeliana» (1915), con sus alumnos, y «La teoría del gen» (1926), basados en experimentos con la mosca Drosophila.", "aporte": "Demostró que los genes están en los cromosomas en posiciones definidas, con el primer mapa genético. Recibió el Nobel de Medicina en 1933 y fundó la genética moderna.", "foto": "thomas-hunt-morgan"}, {"n": 186, "nombre": "Marie Salomea Skłodowska-Curie", "wiki": "Marie Curie", "vida": "1867 - 1934", "area": "Física y química", "obra": "Escribió su tesis «Investigaciones sobre las sustancias radiactivas» (1903) y el «Tratado de radiactividad» (1910). Fundó el Instituto del Radio de París.", "aporte": "Descubrió el polonio y el radio y estudió a fondo la radiactividad, término que ella acuñó. Fue la primera persona en ganar dos premios Nobel, de Física (1903) y de Química (1911).", "foto": "marie-curie"}, {"n": 187, "nombre": "Karl Landsteiner", "wiki": "Karl Landsteiner", "vida": "1868 - 1943", "area": "Medicina e inmunología", "obra": "Publicó en 1901 «Sobre los fenómenos de aglutinación de la sangre humana normal», donde describe las diferencias entre muestras de sangre de distintas personas.", "aporte": "Descubrió los grupos sanguíneos A, B y O y, más tarde, el factor Rh, lo que hizo seguras las transfusiones de sangre. Recibió el Nobel de Medicina en 1930.", "foto": "karl-landsteiner"}, {"n": 188, "nombre": "Henrietta Swan Leavitt", "wiki": "Henrietta Swan Leavitt", "vida": "1868 - 1921", "area": "Astronomía", "obra": "Publicó en 1912 «Períodos de veinticinco estrellas variables en la Pequeña Nube de Magallanes», circular del Observatorio de Harvard.", "aporte": "Descubrió que el brillo de las estrellas cefeidas está relacionado con su período de variación, lo que permitió medir distancias cósmicas y luego demostrar que el universo se expande.", "foto": "henrietta-swan-leavitt"}, {"n": 189, "nombre": "Fritz Haber", "wiki": "Fritz Haber", "vida": "1868 - 1934", "area": "Química", "obra": "Publicó entre 1905 y 1910 sus trabajos sobre la síntesis del amoníaco a partir del nitrógeno del aire, industrializada después con Carl Bosch.", "aporte": "Su proceso de síntesis de amoníaco permitió fabricar fertilizantes en masa, de los que depende la alimentación de la mitad de la humanidad. Nobel de Química en 1918; dirigió también la guerra química.", "foto": "fritz-haber"}, {"n": 190, "nombre": "Ernest Rutherford", "wiki": "Ernest Rutherford", "vida": "1871 - 1937", "area": "Física", "obra": "Publicó en 1911 «La dispersión de partículas alfa y beta por la materia y la estructura del átomo» y escribió «Radiactividad» (1904).", "aporte": "Descubrió el núcleo atómico con el experimento de la lámina de oro, identificó las radiaciones alfa y beta y logró la primera transmutación artificial. Nobel de Química en 1908.", "foto": "ernest-rutherford"}, {"n": 191, "nombre": "Oswaldo Gonçalves Cruz", "wiki": "Oswaldo Cruz", "vida": "1872 - 1917", "area": "Medicina y salud pública", "obra": "Dirigió las campañas sanitarias de Río de Janeiro (1903-1909) y fundó el Instituto de Manguinhos, hoy Fundación Oswaldo Cruz, principal centro de investigación biomédica de Brasil.", "aporte": "Erradicó la fiebre amarilla en Río de Janeiro y controló la peste y la viruela con campañas basadas en la ciencia. Fundó la medicina experimental en Brasil.", "foto": "oswaldo-cruz"}, {"n": 192, "nombre": "Guglielmo Marconi", "wiki": "Guglielmo Marconi", "vida": "1874 - 1937", "area": "Física e ingeniería", "obra": "Patentó en 1896 su sistema de telegrafía sin hilos y en 1901 logró transmitir la primera señal de radio a través del océano Atlántico.", "aporte": "Desarrolló la radiocomunicación práctica a larga distancia, que transformó la navegación, la comunicación y los medios. Compartió el Nobel de Física de 1909.", "foto": "guglielmo-marconi"}, {"n": 193, "nombre": "Pedro Eleodoro Paulet Mostajo", "wiki": "Pedro Paulet", "vida": "1874 - 1945", "area": "Ingeniería aeroespacial", "obra": "Diseñó el «Avión Torpedo», nave impulsada por cohetes. Sus experimentos con motores de combustible líquido en París (1895-1897) se difundieron en una carta publicada en 1927.", "aporte": "El arequipeño Pedro Paulet es considerado pionero de la propulsión a cohete con combustible líquido y de la era espacial. Su nombre está en un cráter lunar.", "foto": "pedro-paulet"}, {"n": 194, "nombre": "Carlos Ribeiro Justiniano Chagas", "wiki": "Carlos Chagas", "vida": "1879 - 1934", "area": "Medicina e infectología", "obra": "Publicó en 1909 en Memórias do Instituto Oswaldo Cruz la descripción de una nueva tripanosomiasis humana causada por Trypanosoma cruzi.", "aporte": "Describió completa una nueva enfermedad, el mal de Chagas: su parásito, su insecto transmisor (la vinchuca), su ciclo y sus síntomas. Es un caso único en la historia de la medicina.", "foto": "carlos-chagas"}, {"n": 195, "nombre": "Albert Einstein", "wiki": "Albert Einstein", "vida": "1879 - 1955", "area": "Física teórica", "obra": "Publicó en 1905 cuatro artículos revolucionarios, entre ellos «Sobre la electrodinámica de los cuerpos en movimiento», y en 1915 «Las ecuaciones de campo de la gravitación».", "aporte": "Formuló las teorías de la relatividad especial y general, la equivalencia masa-energía (E = mc²) y explicó el efecto fotoeléctrico, por el que recibió el Nobel de Física en 1921.", "foto": "albert-einstein"}, {"n": 196, "nombre": "Lise Meitner", "wiki": "Lise Meitner", "vida": "1878 - 1968", "area": "Física", "obra": "Publicó con Otto Frisch en 1939 en Nature «Desintegración del uranio por neutrones: un nuevo tipo de reacción nuclear», donde explica y nombra la fisión.", "aporte": "Dio la explicación teórica de la fisión nuclear. Fue excluida del Nobel otorgado a Otto Hahn en 1944; el elemento 109, meitnerio, lleva su nombre.", "foto": "lise-meitner"}, {"n": 197, "nombre": "Alfred Lothar Wegener", "wiki": "Alfred Wegener", "vida": "1880 - 1930", "area": "Meteorología y geofísica", "obra": "Escribió «El origen de los continentes y océanos» (1915), donde reúne pruebas geológicas, fósiles y climáticas de que los continentes estuvieron unidos.", "aporte": "Propuso la deriva continental y el supercontinente Pangea. Fue rechazada en vida y confirmada en los años sesenta con la tectónica de placas. Murió en una expedición a Groenlandia.", "foto": "alfred-wegener"}, {"n": 198, "nombre": "Alexander Fleming", "wiki": "Alexander Fleming", "vida": "1881 - 1955", "area": "Microbiología y medicina", "obra": "Publicó en 1929 en el British Journal of Experimental Pathology «Sobre la acción antibacteriana de los cultivos de un penicillium».", "aporte": "Descubrió la penicilina, primer antibiótico, al notar que un hongo detenía el crecimiento bacteriano. Salvó millones de vidas. Nobel de Medicina en 1945 con Florey y Chain.", "foto": "alexander-fleming"}, {"n": 199, "nombre": "Amalie Emmy Noether", "wiki": "Emmy Noether", "vida": "1882 - 1935", "area": "Matemáticas y física teórica", "obra": "Publicó en 1918 «Problemas variacionales invariantes», con el teorema que lleva su nombre, y en 1921 «Teoría de ideales en anillos».", "aporte": "Su teorema demuestra que cada simetría de la naturaleza corresponde a una ley de conservación, pilar de la física moderna. Fundó el álgebra abstracta moderna.", "foto": "emmy-noether"}, {"n": 200, "nombre": "Max Born", "wiki": "Max Born", "vida": "1882 - 1970", "area": "Física teórica", "obra": "Publicó en 1926 «Sobre la mecánica cuántica de los procesos de colisión» y escribió con Emil Wolf «Principios de óptica» (1959), manual clásico.", "aporte": "Propuso la interpretación probabilística de la función de onda: describe la probabilidad de encontrar una partícula. Recibió el Nobel de Física en 1954.", "foto": "max-born"}, {"n": 201, "nombre": "Robert Hutchings Goddard", "wiki": "Robert Goddard", "vida": "1882 - 1945", "area": "Física e ingeniería aeroespacial", "obra": "Escribió «Un método para alcanzar altitudes extremas» (1919), publicado por el Instituto Smithsoniano, y registró más de doscientas patentes.", "aporte": "Lanzó en 1926 el primer cohete de combustible líquido, en Massachusetts. Sentó las bases técnicas de la astronáutica; la NASA nombró en su honor un centro espacial.", "foto": "robert-goddard"}, {"n": 202, "nombre": "Arthur Stanley Eddington", "wiki": "Arthur Eddington", "vida": "1882 - 1944", "area": "Astrofísica", "obra": "Escribió «La constitución interna de las estrellas» (1926) y obras de divulgación. Dirigió en 1919 la expedición del eclipse a la isla de Príncipe.", "aporte": "Comprobó la desviación de la luz por la gravedad del Sol, confirmando la relatividad general. Propuso que las estrellas se alimentan de la fusión de hidrógeno.", "foto": "arthur-eddington"}, {"n": 203, "nombre": "Carlos Monge Medrano", "wiki": "Carlos Monge Medrano", "vida": "1884 - 1970", "area": "Medicina y fisiología de altura", "obra": "Escribió «La enfermedad de los Andes» (1928) y «Aclimatación en los Andes» (1948), basados en estudios de pobladores de las alturas del Perú.", "aporte": "Describió el mal de montaña crónico, hoy llamado enfermedad de Monge, y fundó la fisiología de altura en el Perú. Creó el Instituto de Biología Andina.", "foto": "carlos-monge-medrano"}, {"n": 204, "nombre": "Niels Henrik David Bohr", "wiki": "Niels Bohr", "vida": "1885 - 1962", "area": "Física", "obra": "Publicó en 1913 «Sobre la constitución de átomos y moléculas», trilogía de artículos en Philosophical Magazine. Fundó el Instituto de Física Teórica de Copenhague.", "aporte": "Propuso el modelo atómico con electrones en órbitas de energía fija, que explicó el espectro del hidrógeno. Formuló el principio de complementariedad. Nobel de Física en 1922.", "foto": "niels-bohr"}, {"n": 205, "nombre": "Erwin Rudolf Josef Alexander Schrödinger", "wiki": "Erwin Schrödinger", "vida": "1887 - 1961", "area": "Física teórica", "obra": "Publicó en 1926 «Cuantización como problema de valores propios», cuatro artículos con su ecuación de onda, y escribió «¿Qué es la vida?» (1944).", "aporte": "Formuló la ecuación de Schrödinger, que describe la evolución de los sistemas cuánticos. Su paradoja del gato ilustra lo extraño de la física cuántica. Nobel en 1933.", "foto": "erwin-schrodinger"}, {"n": 206, "nombre": "Srinivasa Ramanujan", "wiki": "Srinivasa Ramanujan", "vida": "1887 - 1920", "area": "Matemáticas", "obra": "Dejó cuadernos con unos tres mil novecientos resultados, muchos sin demostración, y publicó artículos con G. H. Hardy en Cambridge. Su «cuaderno perdido» apareció en 1976.", "aporte": "Autodidacta indio que hizo aportes extraordinarios a la teoría de números, las particiones, las series infinitas y las fracciones continuas. Sus fórmulas aún se estudian.", "foto": "srinivasa-ramanujan"}, {"n": 207, "nombre": "Bernardo Alberto Houssay", "wiki": "Bernardo Houssay", "vida": "1887 - 1971", "area": "Fisiología y medicina", "obra": "Escribió «Fisiología humana» (1945), manual usado en toda Latinoamérica, y trabajos sobre el papel de la hipófisis en el metabolismo del azúcar.", "aporte": "Descubrió el papel de la hipófisis en la regulación del azúcar en sangre. Fue el primer latinoamericano en ganar un Nobel de ciencias (Medicina, 1947).", "foto": "bernardo-houssay"}, {"n": 208, "nombre": "Santiago Antúnez de Mayolo Gomero", "wiki": "Santiago Antúnez de Mayolo", "vida": "1887 - 1967", "area": "Ingeniería, física y matemáticas", "obra": "Diseñó la central hidroeléctrica del Cañón del Pato y escribió «Hipótesis del neutrón» (1924), además de obras de física y matemáticas.", "aporte": "Predijo en 1924 la existencia de una partícula neutra en el núcleo, antes del descubrimiento del neutrón en 1932. Impulsó la hidroelectricidad en el Perú.", "foto": "santiago-antunez-de-mayolo"}, {"n": 209, "nombre": "Chandrasekhara Venkata Raman", "wiki": "C. V. Raman", "vida": "1888 - 1970", "area": "Física", "obra": "Publicó en 1928 en Nature «Un nuevo tipo de radiación secundaria», donde describe el efecto que lleva su nombre.", "aporte": "Descubrió el efecto Raman: la luz cambia de longitud de onda al atravesar una sustancia, lo que permite identificar moléculas. Primer asiático en ganar el Nobel de Física (1930).", "foto": "c-v-raman"}, {"n": 210, "nombre": "Edwin Powell Hubble", "wiki": "Edwin Hubble", "vida": "1889 - 1953", "area": "Astronomía", "obra": "Publicó en 1929 «Una relación entre distancia y velocidad radial entre nebulosas extragalácticas» y escribió «El reino de las nebulosas» (1936).", "aporte": "Demostró que existen otras galaxias además de la Vía Láctea y que el universo se expande. La ley de Hubble y el telescopio espacial llevan su nombre.", "foto": "edwin-hubble"}, {"n": 211, "nombre": "Ronald Aylmer Fisher", "wiki": "Ronald Fisher", "vida": "1890 - 1962", "area": "Estadística y genética", "obra": "Escribió «Métodos estadísticos para investigadores» (1925), «La teoría genética de la selección natural» (1930) y «El diseño de experimentos» (1935).", "aporte": "Fundó la estadística moderna con el análisis de varianza y el diseño de experimentos. Unió la genética mendeliana con la evolución de Darwin en la síntesis moderna.", "foto": "ronald-fisher"}, {"n": 212, "nombre": "Frederick Grant Banting", "wiki": "Frederick Banting", "vida": "1891 - 1941", "area": "Medicina", "obra": "Publicó en 1922 con Charles Best «La secreción interna del páncreas», donde describe la obtención de un extracto eficaz contra la diabetes.", "aporte": "Descubrió la insulina junto con Best, lo que convirtió la diabetes de enfermedad mortal en tratable. Recibió el Nobel de Medicina en 1923 a los treinta y dos años.", "foto": "frederick-banting"}, {"n": 213, "nombre": "Louis Victor Pierre Raymond, duque de Broglie", "wiki": "Louis de Broglie", "vida": "1892 - 1987", "area": "Física teórica", "obra": "Presentó en 1924 su tesis doctoral «Investigaciones sobre la teoría de los cuantos», donde propone ondas asociadas a las partículas materiales.", "aporte": "Propuso que toda partícula, como el electrón, tiene comportamiento de onda (dualidad onda-partícula), base de la mecánica cuántica y del microscopio electrónico. Nobel en 1929.", "foto": "louis-de-broglie"}, {"n": 214, "nombre": "Satyendra Nath Bose", "wiki": "Satyendra Nath Bose", "vida": "1894 - 1974", "area": "Física", "obra": "Escribió en 1924 «La ley de Planck y la hipótesis de los cuantos de luz», que Einstein tradujo al alemán y publicó en la Zeitschrift für Physik.", "aporte": "Desarrolló la estadística de Bose-Einstein. Las partículas llamadas bosones llevan su nombre, y su trabajo predijo un nuevo estado de la materia, el condensado de Bose-Einstein.", "foto": "satyendra-nath-bose"}, {"n": 215, "nombre": "Norbert Wiener", "wiki": "Norbert Wiener", "vida": "1894 - 1964", "area": "Matemáticas y cibernética", "obra": "Escribió «Cibernética, o el control y comunicación en el animal y la máquina» (1948) y «El uso humano de los seres humanos» (1950).", "aporte": "Fundó la cibernética, ciencia del control y la retroalimentación en máquinas y seres vivos. Su trabajo es base de la automatización, la robótica y la inteligencia artificial.", "foto": "norbert-wiener"}, {"n": 216, "nombre": "Aleksandr Ivánovich Oparin", "wiki": "Aleksandr Oparin", "vida": "1894 - 1980", "area": "Bioquímica", "obra": "Escribió «El origen de la vida» (1924, ampliado en 1936), donde propone cómo la vida pudo surgir de la química de la Tierra primitiva.", "aporte": "Propuso que la vida surgió de una sopa primordial de moléculas orgánicas formadas en una atmósfera sin oxígeno. Su hipótesis fue apoyada por el experimento de Miller.", "foto": "aleksandr-oparin"}, {"n": 217, "nombre": "Jean William Fritz Piaget", "wiki": "Jean Piaget", "vida": "1896 - 1980", "area": "Psicología y epistemología", "obra": "Escribió «El lenguaje y el pensamiento en el niño» (1923), «El nacimiento de la inteligencia en el niño» (1936) y «La epistemología genética» (1970).", "aporte": "Describió las etapas del desarrollo cognitivo infantil, desde la sensoriomotora hasta la de operaciones formales. Su teoría transformó la educación y la psicología.", "foto": "jean-piaget"}, {"n": 218, "nombre": "Irène Joliot-Curie", "wiki": "Irène Joliot-Curie", "vida": "1897 - 1956", "area": "Química y física", "obra": "Publicó en 1934 con su esposo Frédéric Joliot «Un nuevo tipo de radiactividad» en las Comptes rendus de la Academia de Ciencias de París.", "aporte": "Descubrió con Frédéric Joliot la radiactividad artificial, que permitió producir isótopos para la medicina. Recibieron el Nobel de Química en 1935, como antes sus padres.", "foto": "irene-joliot-curie"}]}, {"titulo": "Siglo XX", "sub": "Nacidos entre 1900 y 1939", "items": [{"n": 219, "nombre": "Wolfgang Ernst Pauli", "wiki": "Wolfgang Pauli", "vida": "1900 - 1958", "area": "Física teórica", "obra": "Publicó en 1925 «Sobre la conexión del cierre de los grupos de electrones en el átomo con la estructura compleja de los espectros», con su principio de exclusión.", "aporte": "Formuló el principio de exclusión: dos electrones no pueden ocupar el mismo estado cuántico, lo que explica la tabla periódica. Predijo el neutrino. Nobel de Física en 1945.", "foto": "wolfgang-pauli"}, {"n": 220, "nombre": "Cecilia Helena Payne-Gaposchkin", "wiki": "Cecilia Payne-Gaposchkin", "vida": "1900 - 1979", "area": "Astronomía y astrofísica", "obra": "Escribió en 1925 su tesis «Atmósferas estelares», considerada una de las más brillantes de la astronomía. Fue la primera mujer en dirigir un departamento en Harvard.", "aporte": "Demostró que las estrellas están compuestas mayoritariamente de hidrógeno y helio, contra la opinión dominante que suponía una composición parecida a la de la Tierra.", "foto": "cecilia-payne-gaposchkin"}, {"n": 221, "nombre": "Enrico Fermi", "wiki": "Enrico Fermi", "vida": "1901 - 1954", "area": "Física", "obra": "Publicó en 1934 su teoría de la desintegración beta y trabajos sobre neutrones lentos. Dirigió la construcción del primer reactor nuclear, la Chicago Pile-1.", "aporte": "Logró en 1942 la primera reacción nuclear en cadena controlada. Formuló la estadística de Fermi-Dirac y la teoría de la interacción débil. Nobel de Física en 1938.", "foto": "enrico-fermi"}, {"n": 222, "nombre": "Werner Karl Heisenberg", "wiki": "Werner Heisenberg", "vida": "1901 - 1976", "area": "Física teórica", "obra": "Publicó en 1925 «Sobre la reinterpretación teórico-cuántica de las relaciones cinemáticas y mecánicas» y en 1927 el artículo sobre el principio de incertidumbre.", "aporte": "Creó la mecánica matricial, primera formulación de la mecánica cuántica, y el principio de incertidumbre: no se puede conocer a la vez con precisión la posición y la velocidad. Nobel en 1932.", "foto": "werner-heisenberg"}, {"n": 223, "nombre": "Linus Carl Pauling", "wiki": "Linus Pauling", "vida": "1901 - 1994", "area": "Química y bioquímica", "obra": "Escribió «La naturaleza del enlace químico» (1939), uno de los libros científicos más citados del siglo, y describió la hélice alfa de las proteínas en 1951.", "aporte": "Explicó el enlace químico con la mecánica cuántica y la estructura de las proteínas. Es la única persona con dos Nobel no compartidos: Química (1954) y Paz (1962).", "foto": "linus-pauling"}, {"n": 224, "nombre": "Alberto Hurtado Abadía", "wiki": "Alberto Hurtado Abadía", "vida": "1901 - 1983", "area": "Medicina y fisiología de altura", "obra": "Publicó estudios sobre la adaptación del organismo a la altura, entre ellos trabajos sobre la sangre y la respiración en los pobladores de Morococha y Cerro de Pasco.", "aporte": "Describió los mecanismos de adaptación fisiológica del habitante andino a la hipoxia. Fue ministro de Salud y fundador de la Universidad Peruana Cayetano Heredia.", "foto": "alberto-hurtado-abadia"}, {"n": 225, "nombre": "Barbara McClintock", "wiki": "Barbara McClintock", "vida": "1902 - 1992", "area": "Genética y citogenética", "obra": "Publicó en 1950 «El origen y comportamiento de los loci mutables en el maíz» en Proceedings of the National Academy of Sciences.", "aporte": "Descubrió los elementos genéticos móviles o transposones, genes que saltan de lugar en el cromosoma. Su hallazgo fue ignorado décadas; recibió el Nobel de Medicina en 1983.", "foto": "barbara-mcclintock"}, {"n": 226, "nombre": "Paul Adrien Maurice Dirac", "wiki": "Paul Dirac", "vida": "1902 - 1984", "area": "Física teórica", "obra": "Escribió «Los principios de la mecánica cuántica» (1930), uno de los textos de física más influyentes, y publicó en 1928 «La teoría cuántica del electrón».", "aporte": "Formuló la ecuación de Dirac, que une mecánica cuántica y relatividad, y predijo la antimateria, confirmada con el positrón en 1932. Nobel de Física en 1933.", "foto": "paul-dirac"}, {"n": 227, "nombre": "John von Neumann", "wiki": "John von Neumann", "vida": "1903 - 1957", "area": "Matemáticas, física y computación", "obra": "Escribió «Fundamentos matemáticos de la mecánica cuántica» (1932), «Teoría de juegos y comportamiento económico» (1944) y el informe EDVAC (1945).", "aporte": "Diseñó la arquitectura de von Neumann, en la que se basan casi todas las computadoras. Fundó la teoría de juegos y aportó a la mecánica cuántica y los autómatas.", "foto": "john-von-neumann"}, {"n": 228, "nombre": "Konrad Zacharias Lorenz", "wiki": "Konrad Lorenz", "vida": "1903 - 1989", "area": "Etología y zoología", "obra": "Escribió «El anillo del rey Salomón» (1949) y «Sobre la agresión» (1963), donde describe el comportamiento instintivo de gansos, peces y otros animales observados en libertad.", "aporte": "Fundó la etología moderna, el estudio científico del comportamiento animal, y describió la impronta en los gansos. Compartió el Nobel de Medicina en 1973.", "foto": "konrad-lorenz"}, {"n": 229, "nombre": "Julius Robert Oppenheimer", "wiki": "Robert Oppenheimer", "vida": "1904 - 1967", "area": "Física teórica", "obra": "Publicó con Hartland Snyder en 1939 «Sobre la contracción gravitacional continua», primer estudio del colapso estelar en un agujero negro. Dirigió el laboratorio de Los Álamos.", "aporte": "Dirigió científicamente el Proyecto Manhattan, que desarrolló la bomba atómica. Aportó a la física de partículas y a la teoría de los agujeros negros.", "foto": "robert-oppenheimer"}, {"n": 230, "nombre": "George Gamow", "wiki": "George Gamow", "vida": "1904 - 1968", "area": "Física y cosmología", "obra": "Publicó en 1948 con Ralph Alpher el artículo «El origen de los elementos químicos» y escribió libros de divulgación como «Uno, dos, tres... infinito» (1947).", "aporte": "Desarrolló la teoría del Big Bang caliente y predijo la radiación de fondo cósmico. Explicó la desintegración alfa por efecto túnel y sugirió el código genético.", "foto": "george-gamow"}, {"n": 231, "nombre": "Severo Ochoa de Albornoz", "wiki": "Severo Ochoa", "vida": "1905 - 1993", "area": "Bioquímica", "obra": "Publicó en 1955 el descubrimiento de la polinucleótido fosforilasa, enzima que le permitió sintetizar ARN en el laboratorio de la Universidad de Nueva York.", "aporte": "Logró la primera síntesis de ARN fuera de una célula, lo que ayudó a descifrar el código genético. Compartió el Nobel de Medicina de 1959 con Arthur Kornberg.", "foto": "severo-ochoa"}, {"n": 232, "nombre": "Kurt Friedrich Gödel", "wiki": "Kurt Gödel", "vida": "1906 - 1978", "area": "Lógica y matemáticas", "obra": "Publicó en 1931 «Sobre proposiciones formalmente indecidibles de los Principia Mathematica y sistemas afines», con sus teoremas de incompletitud.", "aporte": "Demostró que en todo sistema matemático suficientemente rico existen verdades que no pueden probarse dentro de él. Cambió la comprensión de los límites de la lógica.", "foto": "kurt-godel"}, {"n": 233, "nombre": "Grace Brewster Murray Hopper", "wiki": "Grace Hopper", "vida": "1906 - 1992", "area": "Ciencias de la computación", "obra": "Desarrolló el compilador A-0 (1952) y el lenguaje FLOW-MATIC, base del lenguaje COBOL (1959). Trabajó en la computadora Harvard Mark I.", "aporte": "Creó el primer compilador, que traduce instrucciones legibles a lenguaje de máquina, y difundió los lenguajes de programación cercanos al inglés. Popularizó el término bug.", "foto": "grace-hopper"}, {"n": 234, "nombre": "Hans Albrecht Bethe", "wiki": "Hans Bethe", "vida": "1906 - 2005", "area": "Física nuclear", "obra": "Publicó en 1939 «Producción de energía en las estrellas» en Physical Review, donde describe las reacciones nucleares que alimentan al Sol.", "aporte": "Explicó cómo las estrellas producen energía mediante la fusión de hidrógeno en helio (ciclo CNO y cadena protón-protón). Recibió el Nobel de Física en 1967.", "foto": "hans-bethe"}, {"n": 235, "nombre": "Luis Federico Leloir", "wiki": "Luis Federico Leloir", "vida": "1906 - 1987", "area": "Bioquímica", "obra": "Publicó en 1949 sus trabajos sobre los nucleótidos de azúcar y su papel en la formación de los carbohidratos, en el Instituto de Investigaciones Bioquímicas de Buenos Aires.", "aporte": "Descubrió cómo el organismo fabrica y almacena azúcares a partir de los nucleótidos de azúcar. Recibió el Nobel de Química en 1970, el primero de un argentino en esa área.", "foto": "luis-federico-leloir"}, {"n": 236, "nombre": "Rachel Louise Carson", "wiki": "Rachel Carson", "vida": "1907 - 1964", "area": "Biología marina y ecología", "obra": "Escribió «Primavera silenciosa» (1962), que documenta los daños del pesticida DDT en aves, peces y personas, y «El mar que nos rodea» (1951).", "aporte": "Su libro dio origen al movimiento ambientalista moderno y llevó a prohibir el DDT en Estados Unidos y a crear la Agencia de Protección Ambiental.", "foto": "rachel-carson"}, {"n": 237, "nombre": "Hideki Yukawa", "wiki": "Hideki Yukawa", "vida": "1907 - 1981", "area": "Física teórica", "obra": "Publicó en 1935 «Sobre la interacción de las partículas elementales», donde propone una partícula mediadora de la fuerza nuclear.", "aporte": "Predijo la existencia del mesón, partícula que mantiene unido el núcleo atómico, descubierta en 1947. Fue el primer japonés en ganar un Nobel (Física, 1949).", "foto": "hideki-yukawa"}, {"n": 238, "nombre": "Serguéi Pávlovich Koroliov", "wiki": "Serguéi Koroliov", "vida": "1907 - 1966", "area": "Ingeniería aeroespacial", "obra": "Dirigió el diseño del cohete R-7, del satélite Sputnik 1 (1957) y de la nave Vostok 1, que llevó a Yuri Gagarin al espacio en 1961.", "aporte": "Fue el ingeniero jefe del programa espacial soviético, que puso en órbita el primer satélite artificial y el primer ser humano. Su identidad fue secreta hasta su muerte.", "foto": "serguei-koroliov"}, {"n": 239, "nombre": "Lev Davídovich Landau", "wiki": "Lev Landau", "vida": "1908 - 1968", "area": "Física teórica", "obra": "Escribió con Evgeny Lifshitz el «Curso de física teórica», diez volúmenes que siguen siendo referencia mundial en la formación de físicos.", "aporte": "Explicó la superfluidez del helio líquido (Nobel de Física en 1962) y desarrolló la teoría de las transiciones de fase. Aportó a casi todas las ramas de la física.", "foto": "lev-landau"}, {"n": 240, "nombre": "Subrahmanyan Chandrasekhar", "wiki": "Subrahmanyan Chandrasekhar", "vida": "1910 - 1995", "area": "Astrofísica", "obra": "Escribió «Introducción al estudio de la estructura estelar» (1939) y «La teoría matemática de los agujeros negros» (1983).", "aporte": "Calculó el límite de Chandrasekhar: una estrella con más de 1,4 masas solares no puede ser enana blanca y colapsa. Recibió el Nobel de Física en 1983.", "foto": "subrahmanyan-chandrasekhar"}, {"n": 241, "nombre": "Dorothy Mary Crowfoot Hodgkin", "wiki": "Dorothy Crowfoot Hodgkin", "vida": "1910 - 1994", "area": "Química y cristalografía", "obra": "Publicó la estructura de la penicilina (1945), de la vitamina B12 (1955) y de la insulina (1969), tras décadas de estudio con rayos X.", "aporte": "Perfeccionó la cristalografía de rayos X para descifrar la estructura de moléculas biológicas complejas. Recibió el Nobel de Química en 1964.", "foto": "dorothy-crowfoot-hodgkin"}, {"n": 242, "nombre": "Alan Mathison Turing", "wiki": "Alan Turing", "vida": "1912 - 1954", "area": "Matemáticas y ciencias de la computación", "obra": "Publicó en 1936 «Sobre los números computables», donde define la máquina de Turing, y en 1950 «Maquinaria computacional e inteligencia», con el test de Turing.", "aporte": "Fundó la teoría de la computación y la inteligencia artificial. Lideró el descifrado de la máquina Enigma en la Segunda Guerra Mundial, lo que acortó la guerra.", "foto": "alan-turing"}, {"n": 243, "nombre": "Chien-Shiung Wu", "wiki": "Chien-Shiung Wu", "vida": "1912 - 1997", "area": "Física experimental", "obra": "Publicó en 1957 «Prueba experimental de la conservación de la paridad en la desintegración beta» en Physical Review y escribió «Desintegración beta» (1966).", "aporte": "Demostró experimentalmente que la naturaleza distingue entre izquierda y derecha (violación de la paridad). Sus colegas recibieron el Nobel; ella fue llamada la primera dama de la física.", "foto": "chien-shiung-wu"}, {"n": 244, "nombre": "Jonas Edward Salk", "wiki": "Jonas Salk", "vida": "1914 - 1995", "area": "Medicina y virología", "obra": "Anunció en 1955 los resultados del gran ensayo de campo de su vacuna contra la poliomielitis, aplicado a cerca de 1,8 millones de niños.", "aporte": "Desarrolló la primera vacuna eficaz contra la polio con virus inactivados. Renunció a patentarla para que llegara a todos y contribuyó a casi erradicar la enfermedad.", "foto": "jonas-salk"}, {"n": 245, "nombre": "Claude Elwood Shannon", "wiki": "Claude Shannon", "vida": "1916 - 2001", "area": "Matemáticas e ingeniería", "obra": "Publicó en 1948 «Una teoría matemática de la comunicación» en el Bell System Technical Journal. Su tesis de 1937 aplicó el álgebra de Boole a los circuitos.", "aporte": "Fundó la teoría de la información y definió el bit como unidad. Demostró que los circuitos eléctricos pueden hacer lógica, base de las computadoras e internet.", "foto": "claude-shannon"}, {"n": 246, "nombre": "Francis Harry Compton Crick", "wiki": "Francis Crick", "vida": "1916 - 2004", "area": "Biología molecular", "obra": "Publicó con James Watson en 1953 en Nature «Estructura molecular de los ácidos nucleicos», artículo de una página que describe la doble hélice del ADN.", "aporte": "Descubrió con Watson la estructura del ADN y formuló el dogma central de la biología molecular. Compartió el Nobel de Medicina en 1962 con Watson y Wilkins.", "foto": "francis-crick"}, {"n": 247, "nombre": "Herbert Alexander Simon", "wiki": "Herbert A. Simon", "vida": "1916 - 2001", "area": "Inteligencia artificial, economía y psicología", "obra": "Escribió «El comportamiento administrativo» (1947) y «Las ciencias de lo artificial» (1969). Creó con Allen Newell el programa Logic Theorist (1956).", "aporte": "Fue fundador de la inteligencia artificial con los primeros programas que razonaban. Propuso la racionalidad limitada, por la que recibió el Nobel de Economía en 1978.", "foto": "herbert-a-simon"}, {"n": 248, "nombre": "Richard Phillips Feynman", "wiki": "Richard Feynman", "vida": "1918 - 1988", "area": "Física teórica", "obra": "Escribió «Las lecturas de física de Feynman» (1963) y publicó en 1949 «Aproximación espacio-temporal a la electrodinámica cuántica».", "aporte": "Desarrolló la electrodinámica cuántica y los diagramas de Feynman, herramienta central de la física de partículas. Anticipó la nanotecnología y la computación cuántica. Nobel en 1965.", "foto": "richard-feynman"}, {"n": 249, "nombre": "Katherine Coleman Goble Johnson", "wiki": "Katherine Johnson", "vida": "1918 - 2020", "area": "Matemáticas aplicadas", "obra": "Publicó en 1960 con Ted Skopinski el informe «Determinación del ángulo azimutal de una nave en el punto de quemado» para la NASA.", "aporte": "Calculó las trayectorias del primer vuelo orbital estadounidense y del Apolo 11. Fue pionera como matemática afroamericana en la NASA en tiempos de segregación.", "foto": "katherine-johnson"}, {"n": 250, "nombre": "Frederick Sanger", "wiki": "Frederick Sanger", "vida": "1918 - 2013", "area": "Bioquímica", "obra": "Publicó en 1955 la secuencia completa de la insulina y en 1977 «Secuenciación de ADN con inhibidores de terminación de cadena».", "aporte": "Determinó la primera secuencia de una proteína y creó el método de Sanger para leer el ADN, base del Proyecto Genoma Humano. Ganó dos Nobel de Química (1958 y 1980).", "foto": "frederick-sanger"}, {"n": 251, "nombre": "James Ephraim Lovelock", "wiki": "James Lovelock", "vida": "1919 - 2022", "area": "Química atmosférica y ciencias ambientales", "obra": "Escribió «Gaia: una nueva visión de la vida sobre la Tierra» (1979) e inventó el detector de captura de electrones, capaz de medir trazas mínimas de gases.", "aporte": "Propuso la hipótesis Gaia: la Tierra funciona como un sistema que se autorregula. Su detector reveló la presencia de CFC en la atmósfera, clave para proteger la capa de ozono.", "foto": "james-lovelock"}, {"n": 252, "nombre": "Rosalind Elsie Franklin", "wiki": "Rosalind Franklin", "vida": "1920 - 1958", "area": "Química y cristalografía", "obra": "Publicó en 1953 en Nature con Raymond Gosling «Configuración molecular del timonucleato de sodio», con la célebre Fotografía 51 del ADN.", "aporte": "Sus imágenes de difracción de rayos X fueron decisivas para descubrir la doble hélice del ADN. También descifró la estructura de virus como el del mosaico del tabaco.", "foto": "rosalind-franklin"}, {"n": 253, "nombre": "Andréi Dmítrievich Sájarov", "wiki": "Andréi Sájarov", "vida": "1921 - 1989", "area": "Física nuclear", "obra": "Publicó en 1967 «Violación de la simetría CP, asimetría C y asimetría bariónica del universo». Escribió «Reflexiones sobre el progreso» (1968).", "aporte": "Explicó por qué el universo tiene más materia que antimateria. Diseñó el reactor de fusión tokamak y luego defendió los derechos humanos; Nobel de la Paz en 1975.", "foto": "andrei-sajarov"}, {"n": 254, "nombre": "Benoît B. Mandelbrot", "wiki": "Benoît Mandelbrot", "vida": "1924 - 2010", "area": "Matemáticas", "obra": "Escribió «La geometría fractal de la naturaleza» (1982), donde muestra cómo las costas, las nubes y los árboles siguen patrones geométricos irregulares.", "aporte": "Creó la geometría fractal, que estudia figuras que repiten su forma a distintas escalas. El conjunto de Mandelbrot es su emblema; se aplica en física, finanzas y gráficos.", "foto": "benoit-mandelbrot"}, {"n": 255, "nombre": "Mohammad Abdus Salam", "wiki": "Abdus Salam", "vida": "1926 - 1996", "area": "Física teórica", "obra": "Publicó en 1968 su contribución a la teoría electrodébil y fundó en 1964 el Centro Internacional de Física Teórica de Trieste.", "aporte": "Unificó la fuerza electromagnética y la débil, junto con Glashow y Weinberg (Nobel de Física en 1979). Fue el primer paquistaní en ganar un Nobel de ciencias.", "foto": "abdus-salam"}, {"n": 256, "nombre": "John McCarthy", "wiki": "John McCarthy", "vida": "1927 - 2011", "area": "Inteligencia artificial", "obra": "Redactó con Minsky, Rochester y Shannon la propuesta de la Conferencia de Dartmouth (1955) y publicó en 1960 «Funciones recursivas de expresiones simbólicas», origen de LISP.", "aporte": "Acuñó el término inteligencia artificial y organizó en 1956 la conferencia que fundó el campo. Creó el lenguaje LISP y la idea del tiempo compartido en computadoras.", "foto": "john-mccarthy"}, {"n": 257, "nombre": "Marvin Lee Minsky", "wiki": "Marvin Minsky", "vida": "1927 - 2016", "area": "Inteligencia artificial", "obra": "Escribió «Perceptrones» (1969) con Seymour Papert y «La sociedad de la mente» (1986). Cofundó el laboratorio de IA del MIT.", "aporte": "Pionero de la inteligencia artificial, construyó en 1951 una de las primeras redes neuronales (SNARC) y propuso los marcos (frames) para representar conocimiento.", "foto": "marvin-minsky"}, {"n": 258, "nombre": "César Milstein", "wiki": "César Milstein", "vida": "1927 - 2002", "area": "Inmunología y bioquímica", "obra": "Publicó en 1975 con Georges Köhler en Nature «Cultivos continuos de células fusionadas que secretan anticuerpos de especificidad predefinida».", "aporte": "Creó la técnica de los anticuerpos monoclonales, hoy usados en diagnóstico y en tratamientos contra el cáncer. No la patentó. Nobel de Medicina en 1984.", "foto": "cesar-milstein"}, {"n": 259, "nombre": "James Dewey Watson", "wiki": "James Watson", "vida": "1928 - 2025", "area": "Biología molecular", "obra": "Publicó con Crick en 1953 la estructura del ADN y escribió «La doble hélice» (1968) y «Biología molecular del gen» (1965).", "aporte": "Codescubrió la doble hélice del ADN (Nobel de Medicina en 1962) y dirigió los inicios del Proyecto Genoma Humano. Su carrera terminó marcada por declaraciones racistas.", "foto": "james-watson"}, {"n": 260, "nombre": "Vera Florence Cooper Rubin", "wiki": "Vera Rubin", "vida": "1928 - 2016", "area": "Astronomía", "obra": "Publicó en 1970 con Kent Ford «Rotación de la nebulosa de Andrómeda a partir de un estudio espectroscópico», y en 1980 un estudio de veintiuna galaxias.", "aporte": "Demostró que las estrellas en el borde de las galaxias giran demasiado rápido, prueba de la existencia de materia oscura. El observatorio Vera C. Rubin lleva su nombre.", "foto": "vera-rubin"}, {"n": 261, "nombre": "Murray Gell-Mann", "wiki": "Murray Gell-Mann", "vida": "1929 - 2019", "area": "Física teórica", "obra": "Publicó en 1964 «Un modelo esquemático de bariones y mesones» y escribió «El quark y el jaguar» (1994).", "aporte": "Propuso que protones y neutrones están formados por quarks y clasificó las partículas con el óctuple camino. Recibió el Nobel de Física en 1969.", "foto": "murray-gell-mann"}, {"n": 262, "nombre": "Peter Ware Higgs", "wiki": "Peter Higgs", "vida": "1929 - 2024", "area": "Física teórica", "obra": "Publicó en 1964 en Physical Review Letters «Simetrías rotas y las masas de los bosones gauge», de apenas una página y media.", "aporte": "Predijo el bosón de Higgs y el mecanismo que da masa a las partículas. La partícula se detectó en el CERN en 2012 y recibió el Nobel de Física en 2013.", "foto": "peter-higgs"}, {"n": 263, "nombre": "Edward Osborne Wilson", "wiki": "E. O. Wilson", "vida": "1929 - 2021", "area": "Biología y entomología", "obra": "Escribió «Sociobiología: la nueva síntesis» (1975), «Sobre la naturaleza humana» (1978) y «La diversidad de la vida» (1992).", "aporte": "Fundó la sociobiología y popularizó el término biodiversidad. Fue la mayor autoridad mundial en hormigas y desarrolló la teoría de la biogeografía de islas.", "foto": "e-o-wilson"}, {"n": 264, "nombre": "Tu Youyou", "wiki": "Tu Youyou", "vida": "1930 -", "area": "Química farmacéutica", "obra": "Dirigió desde 1969 el proyecto secreto 523 contra la malaria y publicó la extracción de la artemisinina a partir de la planta Artemisia annua.", "aporte": "Descubrió la artemisinina inspirándose en textos de medicina tradicional china; ha salvado millones de vidas de pacientes con malaria. Nobel de Medicina en 2015.", "foto": "tu-youyou"}, {"n": 265, "nombre": "Stanley Lloyd Miller", "wiki": "Stanley Miller", "vida": "1930 - 2007", "area": "Química", "obra": "Publicó en 1953 en Science «Una producción de aminoácidos bajo posibles condiciones de la Tierra primitiva», con su director Harold Urey.", "aporte": "Demostró con el experimento de Miller-Urey que descargas eléctricas en una mezcla de gases producen aminoácidos, apoyando que la vida pudo surgir de la química.", "foto": "stanley-miller"}, {"n": 266, "nombre": "Roger Penrose", "wiki": "Roger Penrose", "vida": "1931 -", "area": "Física matemática", "obra": "Publicó en 1965 «Colapso gravitacional y singularidades espacio-temporales» y escribió «La nueva mente del emperador» (1989) y «El camino a la realidad» (2004).", "aporte": "Demostró que los agujeros negros son una consecuencia inevitable de la relatividad general (Nobel de Física en 2020). Creó los teselados de Penrose.", "foto": "roger-penrose"}, {"n": 267, "nombre": "Luc Montagnier", "wiki": "Luc Montagnier", "vida": "1932 - 2022", "area": "Virología", "obra": "Publicó en 1983 en Science con Françoise Barré-Sinoussi el aislamiento de un retrovirus en un paciente con linfadenopatía, luego llamado VIH.", "aporte": "Codescubrió el virus del sida (VIH), lo que permitió las pruebas diagnósticas y los tratamientos. Compartió el Nobel de Medicina en 2008; luego defendió ideas sin base científica.", "foto": "luc-montagnier"}, {"n": 268, "nombre": "Steven Weinberg", "wiki": "Steven Weinberg", "vida": "1933 - 2021", "area": "Física teórica", "obra": "Publicó en 1967 «Un modelo de leptones», uno de los artículos más citados de la física, y escribió «Los tres primeros minutos del universo» (1977).", "aporte": "Unificó las fuerzas electromagnética y débil en la teoría electrodébil, pilar del modelo estándar. Compartió el Nobel de Física en 1979 con Glashow y Salam.", "foto": "steven-weinberg"}, {"n": 269, "nombre": "Carl Edward Sagan", "wiki": "Carl Sagan", "vida": "1934 - 1996", "area": "Astronomía y divulgación", "obra": "Escribió «Cosmos» (1980), basado en la serie de televisión vista por cientos de millones, «Los dragones del Edén» (Pulitzer en 1978) y «Un punto azul pálido» (1994).", "aporte": "Explicó el efecto invernadero extremo de Venus, participó en las misiones Viking y Voyager y fue el mayor divulgador científico de su tiempo.", "foto": "carl-sagan"}, {"n": 270, "nombre": "Valerie Jane Morris Goodall", "wiki": "Jane Goodall", "vida": "1934 - 2025", "area": "Primatología y etología", "obra": "Escribió «A la sombra del hombre» (1971) y «Los chimpancés de Gombe» (1986), basados en más de sesenta años de estudio de chimpancés en Tanzania.", "aporte": "Descubrió que los chimpancés fabrican herramientas, cazan y tienen vida social compleja, lo que cambió la definición de lo humano. Fundó el Instituto Jane Goodall para la conservación.", "foto": "jane-goodall"}, {"n": 271, "nombre": "Lynn Margulis", "wiki": "Lynn Margulis", "vida": "1938 - 2011", "area": "Biología", "obra": "Publicó en 1967 «Sobre el origen de las células que se dividen por mitosis» y escribió «Simbiosis en la evolución celular» (1981).", "aporte": "Demostró que las mitocondrias y los cloroplastos fueron bacterias libres que se integraron en otras células (teoría endosimbiótica), lo que cambió la visión de la evolución.", "foto": "lynn-margulis"}, {"n": 272, "nombre": "Ada E. Yonath", "wiki": "Ada Yonath", "vida": "1939 -", "area": "Cristalografía y bioquímica", "obra": "Publicó desde 1980 sus estudios de cristalización del ribosoma y en 2000 su estructura completa a alta resolución.", "aporte": "Descifró la estructura del ribosoma, la máquina celular que fabrica proteínas, lo que ayudó a diseñar antibióticos. Compartió el Nobel de Química en 2009.", "foto": "ada-yonath"}]}, {"titulo": "Ciencia contemporánea", "sub": "Nacidos desde 1940 hasta hoy", "items": [{"n": 273, "nombre": "Kip Stephen Thorne", "wiki": "Kip Thorne", "vida": "1940 -", "area": "Física teórica y astrofísica", "obra": "Escribió con Misner y Wheeler «Gravitación» (1973), manual de relatividad general, y «Agujeros negros y tiempo curvo» (1994). Asesoró la película Interstellar.", "aporte": "Cofundó el observatorio LIGO, que en 2015 detectó por primera vez ondas gravitacionales, predichas por Einstein un siglo antes. Compartió el Nobel de Física en 2017.", "foto": "kip-thorne"}, {"n": 274, "nombre": "Clinton Richard Dawkins", "wiki": "Richard Dawkins", "vida": "1941 -", "area": "Biología evolutiva", "obra": "Escribió «El gen egoísta» (1976), «El fenotipo extendido» (1982) y «El relojero ciego» (1986), libros que difundieron la evolución a millones de lectores.", "aporte": "Popularizó la visión de la evolución centrada en los genes y acuñó el término meme para las unidades de transmisión cultural. Es uno de los grandes divulgadores de la biología.", "foto": "richard-dawkins"}, {"n": 275, "nombre": "Stephen William Hawking", "wiki": "Stephen Hawking", "vida": "1942 - 2018", "area": "Física teórica y cosmología", "obra": "Escribió «Historia del tiempo» (1988), uno de los libros de ciencia más vendidos, y publicó en 1974 en Nature «¿Explosiones de agujeros negros?».", "aporte": "Demostró que los agujeros negros emiten radiación (radiación de Hawking) y estudió las singularidades del origen del universo, pese a vivir décadas con ELA.", "foto": "stephen-hawking"}, {"n": 276, "nombre": "Michel Gustave Édouard Mayor", "wiki": "Michel Mayor", "vida": "1942 -", "area": "Astronomía", "obra": "Publicó en 1995 con Didier Queloz en Nature «Un compañero de masa de Júpiter de una estrella de tipo solar», sobre el planeta 51 Pegasi b.", "aporte": "Descubrió con Queloz el primer planeta fuera del sistema solar que orbita una estrella similar al Sol. Abrió la era de los exoplanetas. Nobel de Física en 2019.", "foto": "michel-mayor"}, {"n": 277, "nombre": "José Mario Molina-Pasquel Henríquez", "wiki": "Mario Molina", "vida": "1943 - 2020", "area": "Química atmosférica", "obra": "Publicó en 1974 con Sherwood Rowland en Nature «Sumidero estratosférico para los clorofluorometanos: destrucción del ozono catalizada por átomos de cloro».", "aporte": "Demostró que los CFC destruyen la capa de ozono, lo que llevó al Protocolo de Montreal. Fue el primer mexicano en ganar el Nobel de Química (1995).", "foto": "mario-molina"}, {"n": 278, "nombre": "Susan Jocelyn Bell Burnell", "wiki": "Jocelyn Bell Burnell", "vida": "1943 -", "area": "Astrofísica", "obra": "Detectó en 1967 durante su doctorado una señal de radio periódica, publicada en 1968 en Nature como «Observación de una fuente de radio que pulsa rápidamente».", "aporte": "Descubrió los púlsares, estrellas de neutrones que giran velozmente. El Nobel de 1974 lo recibió su director; en 2018 donó su premio Breakthrough para becas de estudiantes.", "foto": "jocelyn-bell-burnell"}, {"n": 279, "nombre": "Kary Banks Mullis", "wiki": "Kary Mullis", "vida": "1944 - 2019", "area": "Bioquímica", "obra": "Publicó en 1986 y 1987 los métodos de la reacción en cadena de la polimerasa (PCR), desarrollada en 1983 en la empresa Cetus.", "aporte": "Inventó la PCR, técnica que copia millones de veces un fragmento de ADN en horas. Es base del diagnóstico genético, la medicina forense y las pruebas de COVID-19. Nobel en 1993.", "foto": "kary-mullis"}, {"n": 280, "nombre": "Anton Zeilinger", "wiki": "Anton Zeilinger", "vida": "1945 -", "area": "Física cuántica", "obra": "Publicó en 1997 en Nature con su equipo «Teleportación cuántica experimental» y escribió «El velo de Einstein» (2003).", "aporte": "Realizó la primera teleportación cuántica de un fotón y experimentos clave de entrelazamiento, base de la criptografía cuántica. Compartió el Nobel de Física en 2022.", "foto": "anton-zeilinger"}, {"n": 281, "nombre": "John Craig Venter", "wiki": "Craig Venter", "vida": "1946 -", "area": "Genómica y biotecnología", "obra": "Publicó en 2001 en Science «La secuencia del genoma humano» y en 2010 «Creación de una célula bacteriana controlada por un genoma sintetizado químicamente».", "aporte": "Aceleró la secuenciación del genoma humano con el método de escopeta y creó la primera célula con genoma sintético. Es pionero de la biología sintética.", "foto": "craig-venter"}, {"n": 282, "nombre": "Modesto Montoya Zavaleta", "wiki": "Modesto Montoya", "vida": "1946 -", "area": "Física nuclear", "obra": "Investigó la distribución de energía y masa de los fragmentos de la fisión nuclear en Francia, y publicó artículos científicos y de divulgación sobre ciencia y energía nuclear en el Perú.", "aporte": "Es uno de los físicos peruanos más reconocidos por sus estudios de la fisión. Presidió el Instituto Peruano de Energía Nuclear e impulsa la divulgación científica en el país.", "foto": "modesto-montoya"}, {"n": 283, "nombre": "Geoffrey Everest Hinton", "wiki": "Geoffrey Hinton", "vida": "1947 -", "area": "Inteligencia artificial", "obra": "Publicó en 1986 con Rumelhart y Williams en Nature «Aprendizaje de representaciones mediante retropropagación de errores» y en 2012 AlexNet con sus alumnos.", "aporte": "Es uno de los padres del aprendizaje profundo: difundió la retropropagación y las redes neuronales profundas. Nobel de Física en 2024 y premio Turing en 2018.", "foto": "geoffrey-hinton"}, {"n": 284, "nombre": "Françoise Barré-Sinoussi", "wiki": "Françoise Barré-Sinoussi", "vida": "1
