947 -", "area": "Virología", "obra": "Publicó en 1983 en Science, como primera autora, «Aislamiento de un retrovirus T-linfotrópico de un paciente con riesgo de síndrome de inmunodeficiencia adquirida».", "aporte": "Codescubrió el VIH, causante del sida, lo que permitió desarrollar pruebas y tratamientos. Compartió el Nobel de Medicina en 2008 y ha luchado por el acceso a los tratamientos.", "foto": "francoise-barre-sinoussi"}, {"n": 285, "nombre": "Alain Aspect", "wiki": "Alain Aspect", "vida": "1947 -", "area": "Física cuántica", "obra": "Publicó entre 1981 y 1982 en Physical Review Letters sus experimentos sobre las desigualdades de Bell con pares de fotones entrelazados.", "aporte": "Demostró experimentalmente que el entrelazamiento cuántico es real y que la naturaleza no cumple el realismo local defendido por Einstein. Compartió el Nobel de Física en 2022.", "foto": "alain-aspect"}, {"n": 286, "nombre": "Elizabeth Helen Blackburn", "wiki": "Elizabeth Blackburn", "vida": "1948 -", "area": "Biología molecular", "obra": "Publicó en 1985 con Carol Greider el descubrimiento de la telomerasa y escribió «La solución de los telómeros» (2017) con Elissa Epel.", "aporte": "Descubrió la telomerasa, enzima que protege los extremos de los cromosomas, clave para entender el envejecimiento y el cáncer. Compartió el Nobel de Medicina en 2009.", "foto": "elizabeth-blackburn"}, {"n": 287, "nombre": "Francis Sellers Collins", "wiki": "Francis Collins", "vida": "1950 -", "area": "Genética", "obra": "Dirigió el Proyecto Genoma Humano, cuya secuencia se publicó en 2001 y completó en 2003, y escribió «¿Cómo habla Dios?» (2006).", "aporte": "Lideró el consorcio público que descifró el genoma humano y descubrió genes de la fibrosis quística y otras enfermedades. Dirigió los Institutos Nacionales de Salud de EE. UU.", "foto": "francis-collins"}, {"n": 288, "nombre": "Edward Witten", "wiki": "Edward Witten", "vida": "1951 -", "area": "Física matemática", "obra": "Publicó en 1995 «Dinámica de la teoría de cuerdas en varias dimensiones», que dio lugar a la teoría M, además de trabajos en topología cuántica.", "aporte": "Unificó las distintas teorías de cuerdas en la teoría M. Es el único físico que ha ganado la medalla Fields de matemáticas (1990), por sus aportes a la topología.", "foto": "edward-witten"}, {"n": 289, "nombre": "Barton Zwiebach", "wiki": "Barton Zwiebach", "vida": "1954 -", "area": "Física teórica", "obra": "Escribió «Un primer curso de teoría de cuerdas» (2004), texto de referencia para estudiantes de todo el mundo. Es profesor del Instituto Tecnológico de Massachusetts.", "aporte": "Físico nacido en Lima, aportó a la teoría de campos de cuerdas cerradas. Su libro y sus cursos abiertos de mecánica cuántica han formado a miles de estudiantes.", "foto": "barton-zwiebach"}, {"n": 290, "nombre": "Timothy John Berners-Lee", "wiki": "Tim Berners-Lee", "vida": "1955 -", "area": "Ciencias de la computación", "obra": "Redactó en 1989 en el CERN la propuesta «Gestión de la información» y escribió «Tejiendo la red» (1999). Fundó el consorcio W3C en 1994.", "aporte": "Inventó la World Wide Web, el lenguaje HTML, el protocolo HTTP y las direcciones URL, y renunció a patentarlos para que fueran libres. Premio Turing en 2016.", "foto": "tim-berners-lee"}, {"n": 291, "nombre": "Katalin Karikó", "wiki": "Katalin Karikó", "vida": "1955 -", "area": "Bioquímica", "obra": "Publicó en 2005 con Drew Weissman en Immunity «Supresión del reconocimiento del ARN por receptores tipo Toll», sobre ARN mensajero modificado.", "aporte": "Descubrió cómo modificar el ARN mensajero para que no provoque inflamación, lo que hizo posibles las vacunas de ARNm contra la COVID-19. Nobel de Medicina en 2023.", "foto": "katalin-kariko"}, {"n": 292, "nombre": "Svante Pääbo", "wiki": "Svante Pääbo", "vida": "1955 -", "area": "Genética evolutiva", "obra": "Publicó en 2010 en Science «Un borrador de la secuencia del genoma neandertal» y escribió «El hombre de Neandertal» (2014).", "aporte": "Fundó la paleogenómica al secuenciar el genoma del neandertal y descubrir a los denisovanos. Demostró que los humanos actuales llevan ADN de ellos. Nobel de Medicina en 2022.", "foto": "svante-paabo"}, {"n": 293, "nombre": "Fabiola León-Velarde Servetto", "wiki": "Fabiola León-Velarde", "vida": "1956 -", "area": "Fisiología de altura", "obra": "Publicó numerosos estudios sobre la adaptación humana a la altura y coordinó el consenso internacional de 2005 sobre la definición del mal de montaña crónico.", "aporte": "Científica peruana destacada en fisiología de altura. Fue rectora de la Universidad Peruana Cayetano Heredia y presidenta del CONCYTEC, impulsando la ciencia en el Perú.", "foto": "fabiola-leon-velarde"}, {"n": 294, "nombre": "Andre Konstantin Geim", "wiki": "Andre Geim", "vida": "1958 -", "area": "Física de materiales", "obra": "Publicó en 2004 con Konstantín Novosiólov en Science «Efecto de campo eléctrico en películas de carbono atómicamente delgadas».", "aporte": "Aisló el grafeno, una lámina de carbono de un átomo de espesor, el material más delgado y resistente conocido. Compartió el Nobel de Física en 2010.", "foto": "andre-geim"}, {"n": 295, "nombre": "Donna Theo Strickland", "wiki": "Donna Strickland", "vida": "1959 -", "area": "Física (óptica y láser)", "obra": "Publicó en 1985 con Gérard Mourou «Compresión de pulsos ópticos amplificados con chirp», su primer artículo científico, base de su tesis doctoral.", "aporte": "Desarrolló la amplificación de pulsos de láser con chirp, que produce pulsos ultracortos e intensos usados en cirugía ocular. Compartió el Nobel de Física en 2018.", "foto": "donna-strickland"}, {"n": 296, "nombre": "Drew Weissman", "wiki": "Drew Weissman", "vida": "1959 -", "area": "Inmunología", "obra": "Publicó con Katalin Karikó en 2005 y 2008 los trabajos sobre ARN mensajero con nucleósidos modificados, en la Universidad de Pensilvania.", "aporte": "Junto a Karikó hizo posible usar el ARN mensajero en vacunas sin provocar reacciones inflamatorias. Compartió el Nobel de Medicina en 2023.", "foto": "drew-weissman"}, {"n": 297, "nombre": "Peter Williston Shor", "wiki": "Peter Shor", "vida": "1959 -", "area": "Computación cuántica y matemáticas", "obra": "Publicó en 1994 «Algoritmos para computación cuántica: logaritmos discretos y factorización», donde presenta el algoritmo que lleva su nombre.", "aporte": "Creó el algoritmo de Shor, que factoriza números enormes de forma eficiente en una computadora cuántica y amenaza la criptografía actual. Impulsó toda la computación cuántica.", "foto": "peter-shor"}, {"n": 298, "nombre": "Yann André LeCun", "wiki": "Yann LeCun", "vida": "1960 -", "area": "Inteligencia artificial", "obra": "Publicó en 1989 y 1998 los trabajos sobre redes neuronales convolucionales, como «Aprendizaje basado en gradientes aplicado al reconocimiento de documentos».", "aporte": "Creó las redes neuronales convolucionales, base de la visión artificial y el reconocimiento de imágenes. Compartió el premio Turing de 2018 con Hinton y Bengio.", "foto": "yann-lecun"}, {"n": 299, "nombre": "Shinya Yamanaka", "wiki": "Shinya Yamanaka", "vida": "1962 -", "area": "Biología celular", "obra": "Publicó en 2006 en Cell con Kazutoshi Takahashi «Inducción de células madre pluripotentes a partir de cultivos de fibroblastos de ratón».", "aporte": "Descubrió cómo convertir células adultas en células madre pluripotentes con solo cuatro genes, abriendo la medicina regenerativa sin usar embriones. Nobel de Medicina en 2012.", "foto": "shinya-yamanaka"}, {"n": 300, "nombre": "Jennifer Anne Doudna", "wiki": "Jennifer Doudna", "vida": "1964 -", "area": "Bioquímica", "obra": "Publicó en 2012 en Science con Emmanuelle Charpentier «Una endonucleasa de ADN guiada por ARN dual programable». Escribió «Una grieta en la creación» (2017).", "aporte": "Desarrolló con Charpentier la técnica CRISPR-Cas9, capaz de editar genes con precisión, que revoluciona la medicina y la agricultura. Nobel de Quími const USE_FOTOS = true;
const COLORS = ["#e2a564","#df7f5c","#e3cf6f","#9cc97c","#5fc1b0","#63a8e6","#9a8cf0","#e083c9"];
const ERAS = DATA.map((e,i)=>({titulo:e.titulo, sub:e.sub, color:COLORS[i], n:e.items.length}));
const P = [];
DATA.forEach((e,ei)=>e.items.forEach(c=>P.push(Object.assign({},c,{era:ei}))));
const N = P.length;
ERAS.forEach((e,i)=>{ e.start = P.findIndex(p=>p.era===i); });
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const $ = s => document.querySelector(s);
const scene=$('#scene'), stage=$('#stage'), list=$('#list'), panel=$('#panel'), range=$('#range');
$('#count').textContent = N + ' científicos, de la Antigüedad a hoy';

function initials(name){
  const w = name.replace(/[()]/g,'').split(/\s+/).filter(x=>/^[A-ZÁÉÍÓÚÑÖØÄÅŁŠ]/.test(x));
  if(!w.length) return name[0];
  return (w.length>1 ? w[0][0]+w[w.length-1][0] : w[0].slice(0,1)).toUpperCase();
}
function faceHTML(c){
  return `<div class="face" aria-hidden="true"><span>${initials(c.wiki)}</span>`+
    (USE_FOTOS ? `<img src="fotos/${c.foto}.jpg" alt="" loading="lazy" decoding="async" onerror="fotoFallo(this)">` : '')+`</div>`;
}
function fotoFallo(img){ if(img.src.endsWith('.jpg')) img.src=img.src.replace(/\.jpg$/,'.png'); else img.remove(); }
function cardHTML(c){
  return faceHTML(c)+`
  <div class="cn">${c.wiki}</div><div class="cy">${c.vida}</div><div class="ca">${c.area}</div>`;
}
const wikiURL = n => 'https://es.wikipedia.org/w/index.php?search=' + encodeURIComponent(n);

/* ---------- Estrellas ---------- */
const cv=$('#stars'), cx=cv.getContext('2d');
let stars=[];
function makeStars(){
  const d=Math.min(devicePixelRatio||1,2); cv.width=innerWidth*d; cv.height=innerHeight*d;
  stars=[]; const n=Math.round(innerWidth*innerHeight/3500);
  for(let i=0;i<n;i++) stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.2+.2,a:Math.random()*.7+.2,p:Math.random()*6.28});
}
function drawStars(time, shift){
  const w=cv.width,h=cv.height,d=w/innerWidth; cx.clearRect(0,0,w,h);
  for(const s of stars){
    const tw = reduce?1:(.75+.25*Math.sin(time/900+s.p));
    let x=((s.x*w + shift*s.r*d*6) % w + w) % w;
    cx.globalAlpha=s.a*tw; cx.fillStyle='#f3eedf';
    cx.beginPath(); cx.arc(x,s.y*h,s.r*d,0,6.283); cx.fill();
  }
}
makeStars(); addEventListener('resize',()=>{makeStars(); layoutScale();});

/* ---------- Tarjetas 3D ---------- */
P.forEach((c,i)=>{
  const el=document.createElement('button');
  el.className='card'; el.type='button';
  el.style.setProperty('--c', ERAS[c.era].color);
  el.innerHTML=cardHTML(c);
  el.setAttribute('aria-label', c.nombre+', '+c.vida);
  el.addEventListener('click',()=>{ if(moved) return; open(i); });
  scene.appendChild(el); c.el=el;
});

const A = 360/16, R = 560, DY = 17;          // hélice
const SR = 1150;                               // cúpula
let mode='helix', t=0, target=0, k=1;
let rx=-8, ry=0, vry=0;                        // cúpula
let playing=false, selected=-1;

// posiciones de la cúpula (esfera de Fibonacci)
const golden=Math.PI*(3-Math.sqrt(5));
P.forEach((c,i)=>{
  const y=1-(i/(N-1))*2, r=Math.sqrt(1-y*y), th=golden*i;
  c.sx=Math.cos(th)*r; c.sy=y; c.sz=Math.sin(th)*r;
  c.lon=Math.atan2(c.sx,c.sz)*180/Math.PI; c.lat=Math.asin(y)*180/Math.PI;
  const la=Math.asin(y), lo=Math.atan2(c.sx,c.sz);
  c.vx=-Math.cos(la)*Math.sin(lo); c.vy=Math.sin(la); c.vz=-Math.cos(la)*Math.cos(lo);
});

function layoutScale(){ k = Math.max(.72, Math.min(1, innerWidth/1100, innerHeight/820)); }
layoutScale();

function setCardsHelix(){
  P.forEach((c,i)=>{ c.el.style.transform=`translateY(${i*DY}px) rotateY(${i*A}deg) translateZ(${R}px)`; });
}
function setCardsDome(){
  P.forEach(c=>{ c.el.style.transform=`rotateY(${c.lon}deg) rotateX(${c.lat}deg) translateZ(${-SR}px)`; });
}

function frame(time){
  if(mode==='helix'){
    if(playing){ target=Math.min(N-1, target+0.035); if(target>=N-1) setPlay(false); }
    t += (target-t)*(reduce?1:0.09);
    scene.style.transform=`scale(${k}) translateZ(${-R-260}px) translateY(${-t*DY}px) rotateY(${-t*A}deg)`;
    const ti=Math.max(0,Math.min(N-1,Math.round(t)));
    for(let i=0;i<N;i++){
      const d=Math.abs(i-t), el=P[i].el;
      if(d>34){ if(!el._off){el.classList.add('off');el._off=1;} continue; }
      if(el._off){el.classList.remove('off');el._off=0;}
      el.style.opacity = d<1.5?1: Math.max(.08, 1-(d-1.5)/20).toFixed(3);
    }
    if(ti!==frame.last){ frame.last=ti; range.value=ti; showEra(P[ti].era, ti); }
    drawStars(time, -t*2);
  } else if(mode==='dome'){
    if(!drag){ ry += vry; vry*=0.95; if(!reduce && Math.abs(vry)<0.02) ry+= (playing?0.12:0.03); }
    scene.style.transform=`scale(${k}) translateZ(${SR*0.22}px) rotateX(${rx}deg) rotateY(${ry}deg)`;
    const cy=Math.cos(ry*Math.PI/180), sy=Math.sin(ry*Math.PI/180), cxr=Math.cos(rx*Math.PI/180), sxr=Math.sin(rx*Math.PI/180);
    let best=-1, bz=1;
    for(let i=0;i<N;i++){
      const c=P[i];
      const x1=c.vx*cy+c.vz*sy, z1=-c.vx*sy+c.vz*cy;
      const y2=c.vy*cxr - z1*sxr, zz=c.vy*sxr + z1*cxr;   // zz < 0: al fondo, mirando a la cámara
      const vis = zz < 0.1;
      if(!vis){ if(!c.el._off){c.el.classList.add('off');c.el._off=1;} continue; }
      if(c.el._off){c.el.classList.remove('off');c.el._off=0;}
      c.el.style.opacity = Math.min(1, .25 + (-zz)*1.1).toFixed(3);
      const dd = Math.abs(x1)+Math.abs(y2);
      if(dd<bz){bz=dd;best=i;}
    }
    if(best>=0 && best!==frame.lastDome){ frame.lastDome=best; showEra(P[best].era, best); }
    drawStars(time, ry*3);
  }
  requestAnimationFrame(frame);
}

/* ---------- Época ---------- */
function showEra(ei, idx){
  const e=ERAS[ei];
  document.documentElement.style.setProperty('--era', e.color);
  $('#eraK').textContent = 'Época '+(ei+1)+' de '+ERAS.length+' · N.º '+(idx+1)+' de '+N;
  $('#eraName').textContent = e.titulo;
  $('#eraSub').textContent = e.sub+' · '+e.n+' científicos';
}

/* ---------- Línea de tiempo ---------- */
range.max=N-1;
range.addEventListener('input',()=>{ setPlay(false); target=+range.value; });
const ticks=$('#ticks');
ERAS.forEach((e,i)=>{
  const b=document.createElement('button'); b.type='button';
  b.style.left=(e.start/(N-1)*100)+'%'; b.style.setProperty('--c',e.color);
  b.innerHTML='<span>'+e.titulo.replace('Renacimiento y Revolución Científica','Renacimiento').replace('Ciencia contemporánea','Hoy').replace('Del siglo XIX al XX','XIX-XX')+'</span>';
  b.title=e.titulo; b.setAttribute('aria-label','Ir a '+e.titulo);
  b.addEventListener('click',()=>{ if(mode!=='helix') setMode('helix'); setPlay(false); target=e.start; });
  ticks.appendChild(b);
});
// evitar que las etiquetas se monten
function spaceTicks(){
  let lastEnd=-1; [...ticks.children].forEach(b=>{ b.style.visibility='visible'; const r=b.getBoundingClientRect(); if(r.left<lastEnd+4){ b.style.visibility='hidden'; } else lastEnd=r.right; });
}
setTimeout(spaceTicks,300); addEventListener('resize',spaceTicks);

const play=$('#play');
function setPlay(v){
  playing=v; play.setAttribute('aria-pressed',v);
  $('#playIco').innerHTML = v ? '<rect x="3" y="2" width="3" height="10"/><rect x="8" y="2" width="3" height="10"/>' : '<path d="M3 1.5v11l9-5.5z"/>';
  if(v && mode==='helix' && target>=N-1){ t=target=0; }
}
play.addEventListener('click',()=>setPlay(!playing));

/* ---------- Arrastre y rueda ---------- */
let drag=false, moved=false, px=0, py=0, sx0=0, sy0=0;
stage.addEventListener('pointerdown',e=>{ drag=true; moved=false; px=sx0=e.clientX; py=sy0=e.clientY; stage.classList.add('dragging'); setPlay(false); });
addEventListener('pointermove',e=>{
  if(!drag) return;
  const dx=e.clientX-px, dy=e.clientY-py; px=e.clientX; py=e.clientY;
  if(Math.abs(e.clientX-sx0)+Math.abs(e.clientY-sy0)>6) moved=true;
  if(mode==='helix'){ target=Math.max(0,Math.min(N-1, target - dx*0.035 - dy*0.035)); }
  else if(mode==='dome'){ ry += dx*0.18; vry=dx*0.18; rx=Math.max(-60,Math.min(60, rx - dy*0.18)); }
});
addEventListener('pointerup',()=>{ drag=false; stage.classList.remove('dragging'); setTimeout(()=>moved=false,0); });
stage.addEventListener('wheel',e=>{
  e.preventDefault(); setPlay(false);
  if(mode==='helix') target=Math.max(0,Math.min(N-1, target + (e.deltaY+e.deltaX)*0.012));
  else { ry += e.deltaY*0.05; }
},{passive:false});
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='Escape') close();
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){ if(!panel.hidden) step(1); else if(mode==='helix') target=Math.min(N-1,Math.round(target)+1); }
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ if(!panel.hidden) step(-1); else if(mode==='helix') target=Math.max(0,Math.round(target)-1); }
});

/* ---------- Modos ---------- */
const modeBtns={helix:$('#m-helix'),dome:$('#m-dome'),list:$('#m-list')};
function setMode(m){
  mode=m; Object.entries(modeBtns).forEach(([k2,b])=>b.setAttribute('aria-pressed',k2===m));
  stage.hidden = m==='list'; list.hidden = m!=='list';
  $('#timeline').hidden = m!=='helix'; $('#eraBox').hidden = m==='list';
  P.forEach(c=>{c.el.classList.remove('off'); c.el._off=0;});
  frame.last=-1; frame.lastDome=-1;
  if(m==='helix') setCardsHelix();
  if(m==='dome'){ setCardsDome(); setPlay(false); }
  if(m==='list'){ setPlay(false); drawStars(0,0); }
}
modeBtns.helix.onclick=()=>setMode('helix');
modeBtns.dome.onclick=()=>setMode('dome');
modeBtns.list.onclick=()=>setMode('list');

/* ---------- Vista de fichas ---------- */
ERAS.forEach((e,ei)=>{
  const s=document.createElement('section'); s.className='lera'; s.style.setProperty('--c',e.color);
  s.innerHTML=`<h2>${e.titulo}</h2><p>${e.sub} · ${e.n} científicos</p><div class="grid"></div>`;
  const g=s.querySelector('.grid');
  P.forEach((c,i)=>{ if(c.era!==ei) return;
    const el=document.createElement('button'); el.className='card'; el.type='button'; el.style.setProperty('--c',e.color);
    el.innerHTML=cardHTML(c); el.id='f'+i; el.addEventListener('click',()=>open(i)); g.appendChild(el); });
  list.appendChild(s);
});

/* ---------- Ficha ---------- */
function open(i){
  selected=i; const c=P[i], e=ERAS[c.era];
  P.forEach(p=>p.el.classList.remove('active')); c.el.classList.add('active');
  if(mode==='helix'){ target=i; setPlay(false); }
  panel.style.setProperty('--c', e.color);
  panel.innerHTML=`<button class="close" type="button" aria-label="Cerrar ficha">✕</button>
    ${faceHTML(c)}
    <div class="pnum">N.º ${i+1} de ${N} · ${e.titulo}</div>
    <h3>${c.nombre}</h3>
    <div class="pvida">${c.vida}</div>
    <div class="parea">${c.area}</div>
    <h4>Obra principal</h4><p class="txt">${c.obra}</p>
    <h4>Aporte clave</h4><p class="txt">${c.aporte}</p>
    <div class="pact">
      <a class="wiki" href="${wikiURL(c.wiki)}" target="_blank" rel="noopener">Ver foto en Wikipedia ↗</a>
      <div class="nav"><button type="button" data-d="-1" aria-label="Anterior">←</button><button type="button" data-d="1" aria-label="Siguiente">→</button></div>
    </div>`;
  panel.hidden=false; panel.scrollTop=0;
  panel.querySelector('.close').onclick=close;
  panel.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>step(+b.dataset.d));
}
function step(d){ const j=Math.max(0,Math.min(N-1,selected+d)); open(j); if(mode==='list') document.getElementById('f'+j)?.scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'}); }
function close(){ panel.hidden=true; P.forEach(p=>p.el.classList.remove('active')); selected=-1; }

/* ---------- Búsqueda ---------- */
const q=$('#q'), res=$('#results');
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
P.forEach(c=>c.key=norm(c.nombre+' '+c.wiki+' '+c.area));
q.addEventListener('input',()=>{
  const v=norm(q.value.trim()); if(!v){res.hidden=true;return;}
  const hits=[]; P.forEach((c,i)=>{ if(c.key.includes(v)) hits.push(i); });
  res.innerHTML = hits.length ? hits.slice(0,30).map(i=>`<li><button type="button" data-i="${i}" style="--c:${ERAS[P[i].era].color}"><span class="dot"></span><span>${P[i].wiki}<small>${P[i].vida} · ${P[i].area}</small></span></button></li>`).join('')
    : '<li class="none">Sin resultados para esa búsqueda.</li>';
  res.hidden=false;
  res.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i; res.hidden=true; q.value='';
    if(mode==='list') document.getElementById('f'+i)?.scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'});
    if(mode==='dome'){ ry=-P[i].lon; rx=Math.max(-60,Math.min(60,-P[i].lat)); vry=0; }
    open(i);
  });
});
q.addEventListener('keydown',e=>{ if(e.key==='Enter'){ res.querySelector('button')?.click(); } if(e.key==='Escape'){res.hidden=true;} });
document.addEventListener('pointerdown',e=>{ if(!e.target.closest('.search')) res.hidden=true; });

/* ---------- Inicio ---------- */
setCardsHelix(); showEra(0,0);
if(!reduce){ t=-6; }
requestAnimationFrame(frame);
</script>
